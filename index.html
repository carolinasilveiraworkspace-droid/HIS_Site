<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SITE HIS — piloto</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#f2f4f3;--sf:#fff;--ink:#14201c;--mut:#51605a;--ln:#d5dbd8;--ac:#0e6b5c;--pr:#6a4c93;--wn:#fff3e6;--wnl:#e3b88c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--ln)}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:18px 0 6px;color:var(--mut);font-weight:600}
.tab{padding:10px 14px;min-height:44px;border:0;border-radius:8px;background:none;color:var(--mut);font-weight:600}.tab[aria-pressed=true]{background:var(--ac);color:#fff}
.chip{padding:8px 12px;min-height:44px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:13px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.r{display:flex;flex-wrap:wrap;gap:8px}.m{color:var(--mut);font-size:13px;margin:4px 0}
.app{position:relative;display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 65px)}
#side{padding:4px 20px 20px;background:var(--sf);border-right:1px solid var(--ln);overflow:auto}
#map{width:100%;height:100%}
#fic{position:absolute;right:12px;top:12px;bottom:12px;width:350px;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;z-index:2}#fic[hidden]{display:none}
.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0}.ck small{display:block;color:var(--mut)}
.warn{background:var(--wn);border:1px solid var(--wnl);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.cd{border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin:8px 0}.cd p{margin:4px 0}
.dash{border:1px dashed var(--ln);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
.pin{width:24px;height:24px;border-radius:50%;background:var(--pr);border:3px solid #fff;box-shadow:0 0 0 2px var(--pr);padding:0}
details{margin-top:18px;font-size:13px}summary{font-weight:600;min-height:32px}
.app[hidden],.r[hidden]{display:none}#pg{max-width:1100px;margin:0 auto;padding:16px 20px 40px}#pg h2.h{font-size:18px;color:var(--ink);margin:8px 0 4px}#pg h3{font-size:15px;margin:20px 0 4px;color:var(--ink)}#pg p{max-width:80ch}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--sf)}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);vertical-align:top;font-size:13px}th{background:#e8edea;color:var(--mut);font-weight:600}select{padding:10px;min-height:44px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);font:inherit}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 65vh;height:auto}#fic{position:static;width:auto;margin:12px}}
</style></head><body>
<header><h1>SITE HIS</h1><nav id="nav" class="r" aria-label="Seções"></nav><nav id="zonas" class="r" aria-label="Regiões"></nav></header>
<div class="app"><aside id="side"></aside><div id="map"></div><aside id="fic" hidden aria-label="Ficha do perímetro"></aside></div>
<main id="pg" hidden></main>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ZN={geral:['Geral',[-46.52,-23.57],9.8],leste:['Zona leste',[-46.405,-23.565],11.4],sul:['Zona sul',[-46.62,-23.6],11.6],norte:['Zona norte',[-46.63,-23.48],11],centro:['Centro',[-46.634,-23.548],12.8]};
/* centros aproximados: substituir pelo centroide do polígono de distritos */
const T=[{id:'vila-mariana',n:'Vila Mariana',z:'sul',c:[-46.637,-23.589]},{id:'ipiranga-sacoma',n:'Ipiranga/Sacomã',z:'sul',c:[-46.607,-23.6]},{id:'guaianases',n:'Guaianases',z:'leste',c:[-46.413,-23.543]},{id:'lajeado',n:'Lajeado',z:'leste',c:[-46.397,-23.556]},{id:'cidade-tiradentes',n:'Cidade Tiradentes',z:'leste',c:[-46.4,-23.583]}];
const L=[
{id:'distritos',g:'Base',n:'Distritos',file:'distritos.geojson',c:'#3b4a44'},
{id:'his',g:'HIS',n:'Empreendimentos e ZEIS',file:'his.geojson',c:'#0e6b5c'},
{id:'risco',g:'Ambiental',n:'Risco geológico e inundação',file:'risco.geojson',c:'#c2561a'},
{id:'cont',g:'Ambiental',n:'Áreas contaminadas',file:'contaminadas.geojson',c:'#14201c'},
{id:'app',g:'Ambiental',n:'APP e cursos d’água',file:'app.geojson',c:'#2d6a9f'},
{id:'veg',g:'Ambiental',n:'Cobertura vegetal',file:'vegetacao.geojson',c:'#4c8c3a'},
{id:'prot',g:'Proteções',n:'Bens tombados, ZEPEC e ZEPAM',file:'protecoes.geojson',c:'#6a4c93'}];
const S={v:'mapa',ft:'todos',per:{},z:'geral',on:new Set(L.map(l=>l.id)),st:{},p:null,tab:'ger',juri:[]};
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:ZN.geral[1],zoom:ZN.geral[2]});
map.addControl(new maplibregl.NavigationControl(),'top-right');
function showErr(m){let d=$('#err');if(!d){d=document.createElement('div');d.id='err';d.className='warn';d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9;max-width:520px';document.body.appendChild(d)}d.textContent=m}
window.addEventListener('error',e=>showErr('Erro: '+(e.message||'desconhecido')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>showErr('Erro: '+((e.reason&&e.reason.message)||e.reason)));
map.on('error',e=>console.error('MapLibre:',e.error||e));
const FT={distritos:'GeoSampa / Prefeitura',his:'GeoSampa, SEHAB, CDHU',risco:'GeoSampa, IPT',cont:'CETESB',app:'GeoSampa',veg:'MapBiomas, PMMA',prot:'CONPRESP, CONDEPHAAT, IPHAN, GeoSampa'};
const V=[['mapa','Mapa'],['jur','Jurídico'],['cob','Cobertura de dados'],['met','Metodologia']];
const terr=id=>S.per[id]?S.per[id].territorio:'';
const WARN='<div class="warn">Processo em andamento não é condenação. Só pessoas jurídicas; cada registro traz fonte e data.</div>';
const REL='<div class="dash"><b>Relato de moradores (trabalho de campo)</b><p class="m">Relato, não verificado, anonimizado. A versão da incorporadora entra só por registros públicos.</p></div>';
function nav(){$('#nav').innerHTML=V.map(([k,n])=>`<button class="tab" data-a="v" data-k="${k}" aria-pressed="${S.v===k}">${n}</button>`).join('');$('#zonas').hidden=S.v!=='mapa'}
function page(){const m=S.v==='mapa';$('.app').hidden=!m;$('#pg').hidden=m;if(m){map.resize();return}$('#pg').innerHTML=({jur,cob,met})[S.v]()}
function jtab(){const r=S.juri.filter(j=>S.ft==='todos'||terr(j.perimetro)===S.ft);return `<table><tr><th>Território</th><th>Perímetro</th><th>Data</th><th>Instância</th><th>Registro</th><th>Parte (PJ)</th><th>Status</th><th>Fonte</th></tr>${r.length?r.map(j=>`<tr><td>${esc(terr(j.perimetro))}</td><td>${esc((S.per[j.perimetro]||{}).nome)}</td><td>${esc(j.data)}</td><td>${esc(j.instancia)}</td><td>${esc(j.registro)}</td><td>${esc(j.parte)}</td><td>${esc(j.status)}</td><td>${esc(j.fonte)}</td></tr>`).join(''):'<tr><td colspan="8">Nenhum registro curado neste território ainda.</td></tr>'}</table>`}
function jur(){return `<h2 class="h">Registros jurídicos curados</h2>${WARN}<label>Território <select data-a="ft">${[['todos','Todos'],...T.map(t=>[t.n,t.n])].map(([k,n])=>`<option value="${esc(k)}"${S.ft===k?' selected':''}>${esc(n)}</option>`).join('')}</select></label><div class="sc" id="jt" style="margin-top:12px">${jtab()}</div>${REL}`}
function cob(){return `<h2 class="h">Cobertura de dados</h2><p class="m">O que já foi carregado em data/. A cobertura por território depende do cruzamento espacial das camadas com os distritos, ainda não implementado.</p><div class="sc"><table><tr><th>Camada</th><th>Fonte</th><th>Arquivo</th><th>Status</th></tr>${L.map(l=>`<tr><td>${l.n}</td><td>${FT[l.id]}</td><td>data/${l.file}</td><td>${esc(S.st[l.id]||'carregando…')}</td></tr>`).join('')}</table></div><h3>Registros jurídicos por território</h3><div class="sc"><table><tr><th>Território</th><th>Região</th><th>Registros</th></tr>${T.map(t=>`<tr><td>${t.n}</td><td>${ZN[t.z][0]}</td><td>${S.juri.filter(j=>terr(j.perimetro)===t.n).length}</td></tr>`).join('')}</table></div>`}
function met(){return `<h2 class="h">Metodologia e fontes</h2>
<h3>Pergunta do piloto</h3><p>Que exposição ambiental e que proteções existem sobre as áreas de HIS e seu entorno, e que registros jurídicos acompanham cada caso? A comparação é entre centro-sul consolidado (Vila Mariana, Ipiranga/Sacomã) e periferia leste (Guaianases, Lajeado, Cidade Tiradentes).</p>
<h3>Unidade territorial</h3><p>Distritos oficiais, que têm polígono definido. Bairros não têm limite oficial em São Paulo. As abas de região (leste, sul, norte, centro) são um agrupamento de leitura, não uma divisão oficial.</p>
<h3>Camadas e fontes</h3><div class="sc"><table><tr><th>Camada</th><th>Fonte</th></tr>${L.map(l=>`<tr><td>${l.n}</td><td>${FT[l.id]}</td></tr>`).join('')}</table></div>
<h3>Registros jurídicos</h3><p>Fontes: atas e sínteses do CONPRESP, Diário Oficial, DataJud (metadados), MPSP, IBAMA e CETESB. Só pessoas jurídicas. O status aparece sempre; processo em andamento não é condenação. Processos em segredo de justiça não entram. Não há ranking de construtoras. Canal de correção de dados: [a definir].</p>
<p>Campos de cada registro: perímetro, data, instância e número, descrição, parte (PJ), status, fonte.</p>
<h3>Limitações</h3><p>Os indicadores espaciais ainda não foram calculados. O trabalho de campo ouviu apenas moradores da Vila Mariana, então a comparação é assimétrica. Os registros jurídicos são curados manualmente e dependem de confirmação nos atos oficiais. O mapa-base é o OpenStreetMap.</p>`}
function zonas(){$('#zonas').innerHTML=Object.entries(ZN).map(([k,v])=>`<button class="tab" data-a="z" data-k="${k}" aria-pressed="${S.z===k}">${v[0]}</button>`).join('')}
function side(){const ts=T.filter(t=>S.z==='geral'||t.z===S.z),gs=[...new Set(L.map(l=>l.g))];
$('#side').innerHTML=(location.protocol==='file:'?'<div class="warn">Abra por um servidor local (python3 -m http.server); o navegador bloqueia a leitura dos arquivos em data/.</div>':'')+'<h2>Territórios</h2>'+(ts.length?`<div class="r">${ts.map(t=>`<button class="chip" data-a="t" data-k="${t.id}">${esc(t.n)}</button>`).join('')}</div>`:'<p class="m">Nenhum território deste recorte no piloto.</p>')+gs.map(g=>`<h2>${g}</h2>`+L.filter(l=>l.g===g).map(l=>`<label class="ck"><input type="checkbox" data-a="lay" data-k="${l.id}"${S.on.has(l.id)?' checked':''}><span>${l.n}<small>${S.st[l.id]||'carregando…'}</small></span></label>`).join('')).join('')+'<details><summary>Regras do jurídico</summary><p>Só pessoas jurídicas. Status sempre visível: processo em andamento não é condenação. Segredo de justiça fica de fora. Sem ranking de construtoras.</p></details>'}
function vis(k){if(!map.getSource(k))return;['-f','-l','-p'].forEach(s=>map.setLayoutProperty(k+s,'visibility',S.on.has(k)?'visible':'none'))}
async function load(l){try{const r=await fetch('data/'+l.file);if(!r.ok)throw 0;const d=await r.json();map.addSource(l.id,{type:'geojson',data:d});
map.addLayer({id:l.id+'-f',type:'fill',source:l.id,filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':l.c,'fill-opacity':.3}});
map.addLayer({id:l.id+'-l',type:'line',source:l.id,filter:['!=',['geometry-type'],'Point'],paint:{'line-color':l.c,'line-width':1.5}});
map.addLayer({id:l.id+'-p',type:'circle',source:l.id,filter:['==',['geometry-type'],'Point'],paint:{'circle-color':l.c,'circle-radius':5,'circle-stroke-width':1,'circle-stroke-color':'#fff'}});
map.on('click',[l.id+'-f',l.id+'-l',l.id+'-p'],e=>{const f=e.features[0];new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${esc(l.n)}</b>`+Object.entries(f.properties).slice(0,8).map(([k,v])=>`<div>${esc(k)}: ${esc(v)}</div>`).join('')).addTo(map)});
S.st[l.id]='carregada ('+d.features.length+')'}catch(e){S.st[l.id]='sem arquivo em data/'}}
async function pins(){try{const d=await(await fetch('data/perimetros.geojson')).json();d.features.forEach(f=>{S.per[f.properties.id]=f.properties;const el=document.createElement('button');el.className='pin';el.setAttribute('aria-label','Abrir ficha: '+f.properties.nome);el.addEventListener('click',()=>{S.p=f.properties;S.tab='ger';ficha()});new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates).addTo(map)})}catch(e){}}
function ficha(){const p=S.p,tb=[['ger','Visão geral'],['amb','Ambiental'],['pro','Proteções'],['jur','Jurídico']];let b;
if(S.tab==='ger')b=`<p>Território: ${esc(p.territorio)}</p>${p.aprox?'<p class="m">Posição aproximada. Substitua pelo polígono oficial.</p>':''}<p>HIS no perímetro: [a calcular]</p>`;
else if(S.tab==='amb')b=L.filter(l=>l.g==='Ambiental').map(l=>`<p>${l.n}: [a calcular]</p>`).join('');
else if(S.tab==='pro')b=`<p>${esc(p.protecao)}</p>`;
else{const r=S.juri.filter(j=>j.perimetro===p.id);b='<div class="warn">Processo em andamento não é condenação. Só pessoas jurídicas; cada registro traz fonte e data.</div>'+(r.length?r.map(j=>`<div class="cd"><b>${esc(j.data)}</b>, ${esc(j.instancia)}<p>${esc(j.registro)}</p><p class="m">Parte: ${esc(j.parte)}<br>Status: ${esc(j.status)}<br>Fonte: ${esc(j.fonte)}</p></div>`).join(''):'<p class="m">Nenhum registro curado ainda.</p>')+'<div class="dash"><b>Relato de moradores</b><p class="m">Relato, não verificado, anonimizado. A versão da incorporadora entra só por registros públicos.</p></div>'}
const el=$('#fic');el.hidden=false;el.innerHTML=`<button class="chip" data-a="x">Fechar ficha</button><h2 style="font-size:18px;color:var(--ink);margin:12px 0 8px">${esc(p.nome)}</h2><div class="r">${tb.map(([k,n])=>`<button class="chip${S.tab===k?' on':''}" data-a="tab" data-k="${k}" aria-pressed="${S.tab===k}">${n}</button>`).join('')}</div>${b}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==='v'){S.v=k;nav();page()}
else if(a==='z'){S.z=k;map.flyTo({center:ZN[k][1],zoom:ZN[k][2]});zonas();side()}
else if(a==='t')map.flyTo({center:T.find(x=>x.id===k).c,zoom:13.5});
else if(a==='tab'){S.tab=k;ficha()}else if(a==='x'){S.p=null;$('#fic').hidden=true}});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.a==='ft'){S.ft=b.value;$('#jt').innerHTML=jtab();return}if(b.dataset.a!=='lay')return;b.checked?S.on.add(b.dataset.k):S.on.delete(b.dataset.k);vis(b.dataset.k)});
zonas();side();nav();
map.on('load',async()=>{try{S.juri=await(await fetch('data/juridico.json')).json()}catch(e){}for(const l of L)await load(l);side();await pins();if(S.v!=='mapa')page()});
</script></body></html>
