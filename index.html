<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SITE HIS — piloto</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Serif+4:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--br:#3A2B24;--cr:#F5F0E8;--bg2:#E7DDCE;--tc:#A94E2F;--sm:#D8977C;--tx:#3A2B24;--mut:#7A6A5E;--ln:#DACFBF}
*{box-sizing:border-box}
body{margin:0;background:var(--cr);color:var(--tx);font:400 14px/1.6 Lato,system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sm);outline-offset:2px}
.eb{display:block;font:700 11px Lato,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--tc)}
header{display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:var(--br);color:var(--cr)}
.lg{width:30px;height:22px;flex:none}
h1{font-size:22px;font-weight:700;margin-right:8px}
.tag{font:italic 400 14px "Source Serif 4",Georgia,serif;color:var(--sm);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex}
.tab{height:60px;padding:0 14px;background:none;border:0;border-bottom:3px solid transparent;color:#CBBBAA;font-weight:700}
.tab[aria-pressed=true]{color:var(--cr);border-bottom-color:var(--sm)}
.app{position:relative;display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 60px)}
.app[hidden]{display:none}
#map{width:100%;height:100%}
#side{background:var(--br);color:#E9DFD2;padding:16px 20px 24px;overflow:auto}
#side h2{font:700 11px Lato,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--sm);margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:1px solid rgba(245,240,232,.22);border-radius:12px;padding:8px 10px;font-size:12px;color:#CBBBAA}
.st b{display:block;font:700 24px "Source Serif 4",Georgia,serif;color:var(--cr)}
.r{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid rgba(245,240,232,.35);background:none;color:var(--cr);font-weight:700;font-size:13px}
.chip.on{background:var(--tc);border-color:var(--tc);color:#fff}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.ck input{accent-color:var(--sm);margin-top:3px}
.sw{width:14px;height:14px;border-radius:4px;flex:none;margin-top:4px;display:inline-block}
.ck small{display:block;color:#CBBBAA}
.m{color:var(--mut);font-size:13px;margin:4px 0}#side .m{color:#CBBBAA}
details{margin-top:20px;font-size:13px}summary{font-weight:700;min-height:32px;cursor:pointer}
#zonas{position:absolute;z-index:3;top:12px;left:calc(300px + (100% - 300px)/2);transform:translateX(-50%);display:flex;gap:2px;background:var(--cr);padding:4px;border-radius:999px;box-shadow:0 2px 12px rgba(42,31,25,.35)}
#zonas[hidden]{display:none}
.zt{height:36px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:700;color:var(--tx)}
.zt[aria-pressed=true]{background:var(--br);color:var(--cr)}
#fic{position:absolute;z-index:4;right:12px;top:60px;bottom:12px;width:360px;overflow:auto;background:var(--cr);border-radius:16px;box-shadow:0 10px 34px rgba(42,31,25,.4);animation:in .18s ease-out}
#fic[hidden]{display:none}
@keyframes in{from{transform:translateX(16px);opacity:0}}
.fh{position:relative;background:var(--br);color:var(--cr);padding:18px 56px 18px 20px}.fh .eb{color:var(--sm)}.fh h2{font-size:23px;line-height:1.2;margin-top:4px}
.cl{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(245,240,232,.14);color:var(--cr);font-size:22px}
.ft{display:flex;border-bottom:1px solid var(--ln);padding:0 8px}
.ft button{padding:12px;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;color:var(--mut)}
.ft button[aria-pressed=true]{color:var(--tc);border-bottom-color:var(--tc)}
.fb{padding:16px 20px 24px}
.lr{display:flex;gap:10px;align-items:center;margin:8px 0}.lr em{margin-left:auto;font-style:normal;color:var(--mut)}
.tl{list-style:none;counter-reset:n;margin:14px 0;padding:0}
.tl li{position:relative;counter-increment:n;margin:0 0 18px;padding-left:40px}
.tl li::before{content:counter(n);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tl b{margin-right:8px}.tl p{margin:4px 0}
.qt{background:var(--br);color:var(--cr);font:italic 400 16px/1.5 "Source Serif 4",Georgia,serif;border-radius:14px;padding:16px 18px;margin:14px 0}
.cb{background:var(--bg2);border-radius:14px;padding:14px 16px;margin:16px 0;font-size:13px}.cb p{margin:6px 0 0}
.warn{background:#F3E3CF;border:1px solid var(--sm);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13px;color:var(--tx)}
.pin{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:0;border-radius:999px;background:var(--cr);box-shadow:0 2px 10px rgba(42,31,25,.45);font-weight:700;font-size:13px;color:var(--tx)}
.pin i{width:22px;height:22px;border-radius:50%;background:var(--tc);box-shadow:inset 0 0 0 4px var(--cr),0 0 0 2px var(--tc)}
.ph{position:relative;overflow:hidden;background:var(--br);color:var(--cr);padding:36px 20px}.ph .eb{color:var(--sm)}.ph h2{font-size:34px;line-height:1.15;margin-top:6px}.ph p{margin:8px 0 0;color:#CBBBAA;max-width:62ch}
.ar{position:absolute;right:48px;bottom:0;height:86%;width:auto}
.pw{position:relative;max-width:1100px;margin:0 auto}.pb{padding:24px 20px 48px}
.sc{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:#FBF8F3}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #E8DECF;vertical-align:top;font-size:13px}
th{background:var(--bg2);color:var(--br);font-weight:700}tr:last-child td{border-bottom:0}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--bg2);color:var(--mut);font-weight:700;font-size:12px}.bd.ok{background:#E3E7CF;color:#4B5A22}
.ms{display:grid;grid-template-columns:220px 1fr;gap:8px 32px;padding:20px 0;border-top:1px solid var(--ln)}.ms:first-child{border-top:0}.ms h3{font-size:18px;color:var(--br)}.ms p{margin:0 0 8px;max-width:75ch}
.sec3{margin:28px 0 10px;font-size:18px;color:var(--br)}
select{padding:10px;min-height:44px;border:1px solid var(--ln);border-radius:10px;background:#FBF8F3;font:inherit}
.maplibregl-popup-content{font:13px Lato,sans-serif;border-radius:10px;background:var(--cr);color:var(--tx)}
#demo{position:absolute;z-index:3;left:312px;bottom:28px;background:var(--cr);border:1px solid var(--sm);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;box-shadow:0 2px 10px rgba(42,31,25,.3)}
.dm{display:inline-block;background:#F3E3CF;border:1px solid var(--sm);color:var(--tc);border-radius:999px;padding:1px 10px;font:700 11px Lato,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 6px 24px;font-size:12px;color:#CBBBAA}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hl{list-style:none;padding:0;margin:8px 0}.hl li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln)}.hl small{display:block;color:var(--mut)}
#gd ol{padding-left:18px;margin:6px 0}#gd li{margin:6px 0;color:#CBBBAA}
@media(prefers-reduced-motion:reduce){#fic{animation:none}}
@media(max-width:800px){#demo{display:none}.tag,.ar{display:none}.app{grid-template-columns:1fr;grid-template-rows:auto 65vh;height:auto}#zonas{top:auto;bottom:12px;left:50%;max-width:94%;overflow-x:auto}#fic{position:static;width:auto;margin:12px}.ms{grid-template-columns:1fr}}
</style></head><body>
<header><svg class="lg" viewBox="0 0 30 22" aria-hidden="true"><path d="M0 22V10a4 4 0 0 1 8 0V22Z" fill="#A94E2F"/><path d="M11 22V6a4 4 0 0 1 8 0V22Z" fill="#D8977C"/><path d="M22 22V12a4 4 0 0 1 8 0V22Z" fill="#EADFD1"/></svg><h1>SITE HIS</h1><span class="tag">Habitação de interesse social, meio ambiente e processos em São Paulo</span><nav id="nav" aria-label="Seções"></nav></header>
<div class="app"><aside id="side"></aside><div id="map"></div><nav id="zonas" aria-label="Regiões"></nav><div id="demo">DEMO · a camada “HIS possíveis” usa dados fictícios</div><aside id="fic" hidden aria-label="Ficha do perímetro"></aside></div>
<main id="pg" hidden></main>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const ZN={geral:['Geral',[-46.52,-23.57],9.8],leste:['Zona leste',[-46.405,-23.565],11.4],sul:['Zona sul',[-46.62,-23.6],11.6],norte:['Zona norte',[-46.63,-23.48],11],centro:['Centro',[-46.634,-23.548],12.8]};
/* centros aproximados: substituir pelo centroide do polígono de distritos */
const T=[{id:'vila-mariana',n:'Vila Mariana',z:'sul',c:[-46.637,-23.589]},{id:'ipiranga-sacoma',n:'Ipiranga/Sacomã',z:'sul',c:[-46.607,-23.6]},{id:'guaianases',n:'Guaianases',z:'leste',c:[-46.413,-23.543]},{id:'lajeado',n:'Lajeado',z:'leste',c:[-46.397,-23.556]},{id:'cidade-tiradentes',n:'Cidade Tiradentes',z:'leste',c:[-46.4,-23.583]}];
const FC={'proposta':'#D8977C','em aprovação':'#C9783F','em obras':'#A94E2F','entregue':'#6B7F3A'};
const FASE=['match',['get','fase'],...Object.entries(FC).flat(),'#A94E2F'];
const L=[
{id:'distritos',g:'Base',n:'Distritos',file:'distritos.geojson',c:'#7A6A5E'},
{id:'his',g:'HIS',n:'Empreendimentos e ZEIS',file:'his.geojson',c:'#A94E2F'},
{id:'hism',g:'HIS',n:'HIS possíveis — DEMO (fictício)',file:'his_mock.geojson',c:'#C9783F',demo:true},
{id:'risco',g:'Ambiental',n:'Risco geológico e inundação',file:'risco.geojson',c:'#D9A03F'},
{id:'cont',g:'Ambiental',n:'Áreas contaminadas',file:'contaminadas.geojson',c:'#6E2233'},
{id:'app',g:'Ambiental',n:'APP e cursos d’água',file:'app.geojson',c:'#2F6F7E'},
{id:'veg',g:'Ambiental',n:'Cobertura vegetal',file:'vegetacao.geojson',c:'#6B7F3A'},
{id:'prot',g:'Proteções',n:'Bens tombados, ZEPEC e ZEPAM',file:'protecoes.geojson',c:'#6E5A8A'}];
const S={v:'mapa',ft:'todos',per:{},z:'geral',on:new Set(L.map(l=>l.id)),st:{},p:null,tab:'ger',juri:[]};
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm',paint:{'raster-saturation':-0.6,'raster-contrast':-0.15,'raster-brightness-max':0.95}}]},center:ZN.geral[1],zoom:ZN.geral[2]});
map.addControl(new maplibregl.NavigationControl(),'top-right');
function showErr(m){let d=$('#err');if(!d){d=document.createElement('div');d.id='err';d.className='warn';d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9;max-width:520px';document.body.appendChild(d)}d.textContent=m}
window.addEventListener('error',e=>showErr('Erro: '+(e.message||'desconhecido')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>showErr('Erro: '+((e.reason&&e.reason.message)||e.reason)));
map.on('error',e=>console.error('MapLibre:',e.error||e));
const FT={distritos:'GeoSampa / Prefeitura',his:'GeoSampa, SEHAB, CDHU',hism:'Dados fictícios (demonstração)',risco:'GeoSampa, IPT',cont:'CETESB',app:'GeoSampa',veg:'MapBiomas, PMMA',prot:'CONPRESP, CONDEPHAAT, IPHAN, GeoSampa'};
const V=[['mapa','Mapa'],['jur','Jurídico'],['cob','Cobertura de dados'],['met','Metodologia']];
const stc=id=>/^carregada/.test(S.st[id]||'')?`<span class="bd ok">✓ ${esc(S.st[id])}</span>`:`<span class="bd">○ ${esc(S.st[id]||'carregando…')}</span>`;
const terr=id=>S.per[id]?S.per[id].territorio:'';
const WARN='<div class="qt">Processo em andamento não é condenação. Só pessoas jurídicas; cada registro traz fonte e data.</div>';
const REL='<div class="cb"><span class="eb">Relato de moradores</span><p>Relato do trabalho de campo, não verificado e anonimizado. A versão da incorporadora entra só por registros públicos.</p></div>';
const AR='<svg class="ar" viewBox="0 0 150 90" aria-hidden="true"><path d="M0 90V38a22 22 0 0 1 44 0V90Z" fill="#A94E2F"/><path d="M54 90V22a22 22 0 0 1 44 0V90Z" fill="#D8977C"/><path d="M108 90V52a21 21 0 0 1 42 0V90Z" fill="#EADFD1"/></svg>';
const rad=Math.PI/180;
function dist(a,b){const dl=(b[1]-a[1])*rad,dn=(b[0]-a[0])*rad,x=Math.sin(dl/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(x))}
function cen(g){const r=g.coordinates[0].slice(0,-1);return[r.reduce((s,q)=>s+q[0],0)/r.length,r.reduce((s,q)=>s+q[1],0)/r.length]}
function ring(c,r){return Array.from({length:65},(_,i)=>{const a=i/64*2*Math.PI;return[c[0]+r*Math.sin(a)/(111320*Math.cos(c[1]*rad)),c[1]+r*Math.cos(a)/111320]})}
function drawBuf(p,on){const d={type:'FeatureCollection',features:on&&p&&p.c&&S.hm?[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ring(p.c,500)]}}]:[]},s=map.getSource('buf');if(s)s.setData(d);else{map.addSource('buf',{type:'geojson',data:d});map.addLayer({id:'buf-l',type:'line',source:'buf',paint:{'line-color':'#3A2B24','line-width':1.5,'line-dasharray':[3,2]}})}}
function nearHis(p,r){return(S.hm||[]).map(f=>({f:f.properties,d:dist(p.c,cen(f.geometry))})).filter(x=>x.d<=r).sort((a,b)=>a.d-b.d)}
function hisBlock(p){if(!S.hm||!p.c)return'<p>HIS no perímetro: [a calcular]</p>';const R=500,n=nearHis(p,R),u=n.reduce((s,x)=>s+(x.f.unidades||0),0);return`<span class="dm">Demo · dados fictícios</span><p><b>${n.length}</b> HIS possíveis a até ${R} m · <b>${u}</b> unidades</p>`+(n.length?`<ul class="hl">${n.map(x=>`<li><span class="sw" style="background:${FC[x.f.fase]}"></span><span>${esc(x.f.nome)}<small>${esc(x.f.tipo)} · ${esc(x.f.fase)} · ${esc(x.f.unidades)} un. · ${Math.round(x.d)} m</small></span></li>`).join('')}</ul>`:'<p class="m">Nenhuma no raio.</p>')+'<p class="m">O círculo tracejado no mapa é o raio de 500 m. Na versão final, o cruzamento usa o polígono oficial do perímetro e as camadas do GeoSampa.</p>'}
function popDemo(p){return`<span class="dm">Dado fictício</span><br><b>${esc(p.nome)}</b><div>${esc(p.tipo)}</div><div>Fase: ${esc(p.fase)}</div><div>Unidades: ${esc(p.unidades)}</div><div>Agente: ${esc(p.agente)}</div><div class="m">${esc(p.nota)}</div>`}
const leg=()=>`<div class="leg">${Object.entries(FC).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}</div>`;
const guide=()=>`<details id="gd"${S.gd===false?'':' open'}><summary>Como funciona (demo)</summary><ol><li><b>Camadas.</b> Cada caixa abaixo liga uma camada, lida de um GeoJSON em data/. O texto cinza mostra se o arquivo foi carregado.</li><li><b>Polígonos coloridos.</b> São HIS possíveis, <u>fictícias</u>. A cor indica a fase (proposta, em aprovação, em obras, entregue). Clique para ver os atributos.</li><li><b>Pino.</b> Marca um perímetro com ficha. Ao abrir, a aba Visão geral conta as HIS a até 500 m (círculo tracejado). É o cruzamento espacial que hoje aparece como “[a calcular]”.</li><li><b>Aba Jurídico.</b> Lista os registros de juridico.json ligados ao perímetro.</li><li><b>Territórios.</b> Os botões levam o mapa ao território.</li></ol></details>`;
function nav(){$('#nav').innerHTML=V.map(([k,n])=>`<button class="tab" data-a="v" data-k="${k}" aria-pressed="${S.v===k}">${n}</button>`).join('');$('#zonas').hidden=S.v!=='mapa'}
function page(){const m=S.v==='mapa';$('.app').hidden=!m;$('#pg').hidden=m;if(m){map.resize();return}const H={jur:['Registros jurídicos','Processos e atos oficiais ligados aos perímetros, sempre com fonte, data e status.'],cob:['Cobertura de dados','O que já foi carregado no site e o que ainda falta coletar.'],met:['Metodologia e fontes','Como o piloto define território, escolhe fontes e trata os registros jurídicos.']}[S.v];let b=({jur,cob,met})[S.v]().replace(/<h2 class="h">.*?<\/h2>/,'');if(S.v==='met')b=b.replace(/<h3>(.*?)<\/h3>([\s\S]*?)(?=<h3>|$)/g,'<section class="ms"><h3>$1</h3><div>$2</div></section>');$('#pg').innerHTML=`<div class="ph"><div class="pw"><span class="eb">${({jur:'Jurídico',cob:'Dados',met:'Método'})[S.v]} · piloto</span><h2>${H[0]}</h2><p>${H[1]}</p></div>${AR}</div><div class="pw pb">${b}</div>`}
function jtab(){const r=S.juri.filter(j=>S.ft==='todos'||terr(j.perimetro)===S.ft);return `<table><tr><th>Território</th><th>Perímetro</th><th>Data</th><th>Instância</th><th>Registro</th><th>Parte (PJ)</th><th>Status</th><th>Fonte</th></tr>${r.length?r.map(j=>`<tr><td>${esc(terr(j.perimetro))}</td><td>${esc((S.per[j.perimetro]||{}).nome)}</td><td>${esc(j.data)}</td><td>${esc(j.instancia)}</td><td>${esc(j.registro)}</td><td>${esc(j.parte)}</td><td>${esc(j.status)}</td><td>${esc(j.fonte)}</td></tr>`).join(''):'<tr><td colspan="8">Nenhum registro curado neste território ainda.</td></tr>'}</table>`}
function jur(){return `<h2 class="h">Registros jurídicos curados</h2>${WARN}<label>Território <select data-a="ft">${[['todos','Todos'],...T.map(t=>[t.n,t.n])].map(([k,n])=>`<option value="${esc(k)}"${S.ft===k?' selected':''}>${esc(n)}</option>`).join('')}</select></label><div class="sc" id="jt" style="margin-top:12px">${jtab()}</div>${REL}`}
function cob(){return `<h2 class="h">Cobertura de dados</h2><p class="m">O que já foi carregado em data/. A cobertura por território depende do cruzamento espacial das camadas com os distritos, ainda não implementado.</p><div class="sc"><table><tr><th>Camada</th><th>Fonte</th><th>Arquivo</th><th>Status</th></tr>${L.map(l=>`<tr><td>${l.n}</td><td>${FT[l.id]}</td><td>data/${l.file}</td><td>${stc(l.id)}</td></tr>`).join('')}</table></div><h3 class="sec3">Registros jurídicos por território</h3><div class="sc"><table><tr><th>Território</th><th>Região</th><th>Registros</th></tr>${T.map(t=>`<tr><td>${t.n}</td><td>${ZN[t.z][0]}</td><td>${S.juri.filter(j=>terr(j.perimetro)===t.n).length}</td></tr>`).join('')}</table></div>`}
function met(){return `<h2 class="h">Metodologia e fontes</h2>
<h3>Pergunta do piloto</h3><p>Que exposição ambiental e que proteções existem sobre as áreas de HIS e seu entorno, e que registros jurídicos acompanham cada caso? A comparação é entre centro-sul consolidado (Vila Mariana, Ipiranga/Sacomã) e periferia leste (Guaianases, Lajeado, Cidade Tiradentes).</p>
<h3>Unidade territorial</h3><p>Distritos oficiais, que têm polígono definido. Bairros não têm limite oficial em São Paulo. As abas de região (leste, sul, norte, centro) são um agrupamento de leitura, não uma divisão oficial.</p>
<h3>Camadas e fontes</h3><div class="sc"><table><tr><th>Camada</th><th>Fonte</th></tr>${L.map(l=>`<tr><td>${l.n}</td><td>${FT[l.id]}</td></tr>`).join('')}</table></div>
<h3>Registros jurídicos</h3><p>Fontes: atas e sínteses do CONPRESP, Diário Oficial, DataJud (metadados), MPSP, IBAMA e CETESB. Só pessoas jurídicas. O status aparece sempre; processo em andamento não é condenação. Processos em segredo de justiça não entram. Não há ranking de construtoras. Canal de correção de dados: [a definir].</p>
<p>Campos de cada registro: perímetro, data, instância e número, descrição, parte (PJ), status, fonte.</p>
<h3>Dados de demonstração</h3><p>A camada “HIS possíveis — DEMO” (data/his_mock.geojson) é inventada: posições, nomes, fases e números não correspondem a empreendimentos reais. Serve para mostrar como o mapa, a legenda por fase e a contagem por raio na ficha funcionam. Para usar dados reais, substitua o arquivo por um GeoJSON do GeoSampa/SEHAB com os mesmos campos (nome, tipo, fase, unidades, agente) e remova o aviso de demonstração.</p>
<h3>Limitações</h3><p>Os indicadores espaciais ainda não foram calculados. O trabalho de campo ouviu apenas moradores da Vila Mariana, então a comparação é assimétrica. Os registros jurídicos são curados manualmente e dependem de confirmação nos atos oficiais. O mapa-base é o OpenStreetMap.</p>`}
function zonas(){$('#zonas').innerHTML=Object.entries(ZN).map(([k,v])=>`<button class="zt" data-a="z" data-k="${k}" aria-pressed="${S.z===k}">${v[0]}</button>`).join('')}
function side(){const ts=T.filter(t=>S.z==='geral'||t.z===S.z),gs=[...new Set(L.map(l=>l.g))],ok=L.filter(l=>/^carregada/.test(S.st[l.id]||'')).length;
$('#side').innerHTML=(location.protocol==='file:'?'<div class="warn">Abra por um servidor local (python3 -m http.server); o navegador bloqueia a leitura dos arquivos em data/.</div>':'')+`<div class="stats"><div class="st"><b>${T.length}</b>territórios</div><div class="st"><b>${ok}/${L.length}</b>camadas</div><div class="st"><b>${S.juri.length}</b>registros</div></div>${guide()}<h2>Territórios</h2>`+(ts.length?`<div class="r">${ts.map(t=>`<button class="chip" data-a="t" data-k="${t.id}">${esc(t.n)}</button>`).join('')}</div>`:'<p class="m">Nenhum território deste recorte no piloto.</p>')+gs.map(g=>`<h2>${g}</h2>`+L.filter(l=>l.g===g).map(l=>`<label class="ck"><input type="checkbox" data-a="lay" data-k="${l.id}"${S.on.has(l.id)?' checked':''}><span class="sw" style="background:${l.c}"></span><span>${l.n}<small>${esc(S.st[l.id]||'carregando…')}</small></span></label>${l.demo?leg():''}`).join('')).join('')+'<details><summary>Regras do jurídico</summary><p>Só pessoas jurídicas. Status sempre visível: processo em andamento não é condenação. Segredo de justiça fica de fora. Sem ranking de construtoras.</p></details>'}
function vis(k){if(!map.getSource(k))return;['-f','-l','-p'].forEach(s=>map.setLayoutProperty(k+s,'visibility',S.on.has(k)?'visible':'none'))}
async function load(l){try{const r=await fetch('data/'+l.file);if(!r.ok)throw 0;const d=await r.json();map.addSource(l.id,{type:'geojson',data:d});
map.addLayer({id:l.id+'-f',type:'fill',source:l.id,filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':l.demo?FASE:l.c,'fill-opacity':l.demo?.5:.3}});
map.addLayer({id:l.id+'-l',type:'line',source:l.id,filter:['!=',['geometry-type'],'Point'],paint:{'line-color':l.demo?FASE:l.c,'line-width':l.demo?2:1.5}});
map.addLayer({id:l.id+'-p',type:'circle',source:l.id,filter:['==',['geometry-type'],'Point'],paint:{'circle-color':l.c,'circle-radius':5,'circle-stroke-width':1,'circle-stroke-color':'#fff'}});
map.on('click',[l.id+'-f',l.id+'-l',l.id+'-p'],e=>{const f=e.features[0];new maplibregl.Popup().setLngLat(e.lngLat).setHTML(l.demo?popDemo(f.properties):`<b>${esc(l.n)}</b>`+Object.entries(f.properties).slice(0,8).map(([k,v])=>`<div>${esc(k)}: ${esc(v)}</div>`).join('')).addTo(map)});
if(l.id==='hism')S.hm=d.features;S.st[l.id]='carregada ('+d.features.length+(l.demo?', demo':'')+')'}catch(e){S.st[l.id]='sem arquivo em data/'}}
async function pins(){try{const d=await(await fetch('data/perimetros.geojson')).json();d.features.forEach(f=>{const pp=S.per[f.properties.id]=Object.assign({},f.properties,{c:f.geometry.coordinates});const el=document.createElement('button');el.className='pin';el.setAttribute('aria-label','Abrir ficha: '+f.properties.nome);el.innerHTML='<i></i><span>'+esc(f.properties.nome)+'</span>';el.addEventListener('click',()=>{S.p=pp;S.tab='ger';ficha()});new maplibregl.Marker({element:el,anchor:'left'}).setLngLat(f.geometry.coordinates).addTo(map)})}catch(e){}}
function ficha(){const p=S.p,tb=[['ger','Visão geral'],['amb','Ambiental'],['pro','Proteções'],['jur','Jurídico']],r=S.juri.filter(j=>j.perimetro===p.id);let b;
if(S.tab==='ger')b=`${hisBlock(p)}<p>Registros jurídicos: ${r.length}</p>${p.aprox?'<p class="m">Posição aproximada. Substitua pelo polígono oficial.</p>':''}`;
else if(S.tab==='amb')b=L.filter(l=>l.g==='Ambiental').map(l=>`<p class="lr"><span class="sw" style="background:${l.c}"></span>${l.n}<em>[a calcular]</em></p>`).join('');
else if(S.tab==='pro')b=`<p>${esc(p.protecao)}</p>`;
else b=WARN+(r.length?`<ol class="tl">${r.map(j=>`<li><b>${esc(j.data)}</b><span class="m">${esc(j.instancia)}</span><p>${esc(j.registro)}</p><p class="m">Parte: ${esc(j.parte)}<br>Status: ${esc(j.status)}<br>Fonte: ${esc(j.fonte)}</p></li>`).join('')}</ol>`:'<p class="m">Nenhum registro curado ainda.</p>')+REL;
const el=$('#fic');el.hidden=false;drawBuf(p,S.tab==='ger');el.innerHTML=`<div class="fh"><button class="cl" data-a="x" aria-label="Fechar ficha">×</button><span class="eb">${esc(p.territorio)}</span><h2>${esc(p.nome)}</h2></div><div class="ft">${tb.map(([k,n])=>`<button data-a="tab" data-k="${k}" aria-pressed="${S.tab===k}">${n}</button>`).join('')}</div><div class="fb">${b}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==='v'){S.v=k;nav();page()}
else if(a==='z'){S.z=k;map.flyTo({center:ZN[k][1],zoom:ZN[k][2]});zonas();side()}
else if(a==='t')map.flyTo({center:T.find(x=>x.id===k).c,zoom:13.5});
else if(a==='tab'){S.tab=k;ficha()}else if(a==='x'){S.p=null;$('#fic').hidden=true;drawBuf(null,false)}});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.a==='ft'){S.ft=b.value;$('#jt').innerHTML=jtab();return}if(b.dataset.a!=='lay')return;b.checked?S.on.add(b.dataset.k):S.on.delete(b.dataset.k);vis(b.dataset.k)});
document.addEventListener('toggle',e=>{if(e.target.id==='gd')S.gd=e.target.open},true);
zonas();side();nav();
map.on('load',async()=>{try{S.juri=await(await fetch('data/juridico.json')).json()}catch(e){}for(const l of L)await load(l);side();await pins();if(S.v!=='mapa')page()});
</script></body></html>
