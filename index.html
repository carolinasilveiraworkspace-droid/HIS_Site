<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="HIS.SP: mapa, guia e assistente para moradores acompanharem a Habitação de Interesse Social em São Paulo e denunciarem usos irregulares no 156.">
<meta name="theme-color" content="#231C18">
<meta property="og:title" content="HIS.SP · Território e participação popular">
<meta property="og:description" content="Moradia popular é para quem precisa. Veja as regras da HIS, reconheça sinais de uso irregular e monte o texto da sua denúncia.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">

<title>HIS.SP · moradia popular é para quem precisa</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAE4; --surface:#FFFFFF; --ink:#231C18; --muted:#5A524C; --line:#CFCDC4; --line-soft:#E0DFD8;
  --brick:#A4472A; --brick-dark:#7E3420; --brick-soft:#F4DED4;
  --clay:#E2A07E; --clay-soft:#F8E8DE;
  --green:#2F5D50; --green-soft:#DCE8E1;
  --header-muted:#BDB3A8;
  --ph-proposta:#E2A07E; --ph-aprov:#C2652F; --ph-obras:#7E3420; --ph-entregue:#2F5D50;
  --r-sm:6px; --r-md:10px; --r-lg:18px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(35,28,24,.08),0 8px 24px -12px rgba(35,28,24,.35);
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
html[data-size="1"]{font-size:112.5%} html[data-size="2"]{font-size:125%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--body)}
h1,h2,h3,h4{font-family:var(--display);font-stretch:85%;line-height:1.08;margin:0;letter-spacing:-.01em}
p{margin:0 0 var(--s3)}
a{color:var(--brick-dark)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.top :focus-visible{outline-color:var(--clay)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--clay);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);z-index:100;font-weight:700}
.skip:focus{left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
.top-in{display:flex;align-items:center;gap:var(--s4);max-width:1440px;margin:0 auto;padding:0 var(--s5);min-height:64px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;flex:none}
.brand b{font:800 1.375rem/1 var(--display);font-stretch:75%;letter-spacing:.01em}
.brand small{display:block;font-size:.75rem;color:var(--header-muted);line-height:1.2;white-space:nowrap}
.nav{display:flex;align-items:stretch;gap:2px;margin-left:auto}
.nav a{white-space:nowrap;display:flex;align-items:center;padding:0 12px;min-height:64px;color:var(--header-muted);text-decoration:none;font-weight:700;font-size:.9375rem;border-bottom:3px solid transparent}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--clay)}
.tools{display:flex;align-items:center;gap:var(--s2)}
.size{display:flex;border:1px solid #5a4d45;border-radius:var(--r-pill);overflow:hidden}
.size button{background:none;border:0;color:#fff;min-width:40px;min-height:40px;cursor:pointer;font-weight:700}
.size button[aria-pressed="true"]{background:#4a3e37}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-pill);border:2px solid transparent;font-weight:700;font-size:.9375rem;text-decoration:none;cursor:pointer;line-height:1.1;text-align:center}
.btn-primary{background:var(--brick);color:#fff}
.btn-primary:hover{background:var(--brick-dark)}
.btn-ghost{background:transparent;border-color:currentColor;color:var(--ink)}
.btn-ghost:hover{background:rgba(35,28,24,.06)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-sm{min-height:36px;padding:0 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top .btn-primary{flex:none;background:var(--clay-soft);color:var(--ink);min-height:46px;padding:0 22px 0 18px;font-size:1rem;box-shadow:0 0 0 0 rgba(226,160,126,.0)}
.top .btn-primary:hover{background:#fff;color:var(--ink)}
.top .btn-primary svg{flex:none}
.menu-btn{display:none;background:none;border:1px solid #5a4d45;color:#fff;border-radius:var(--r-md);min-height:44px;padding:0 14px;font-weight:700;cursor:pointer}
@media (max-width:1360px){
  .brand small{display:none}
  .menu-btn{display:inline-flex;align-items:center;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--ink);flex-direction:column;padding:var(--s2) var(--s4) var(--s4);border-top:1px solid #3d332d}
  .nav.open{display:flex}
  .nav a{min-height:52px;border-bottom:0;border-left:3px solid transparent;padding-left:14px}
  .nav a[aria-current="page"]{border-left-color:var(--clay)}
  .top .btn-primary{padding:0 14px}
}
@media (max-width:560px){.size{display:none}.top-in{padding:0 var(--s3);gap:var(--s2)}}

/* ---------- page shell ---------- */
main{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:var(--s7) var(--s5) var(--s8)}
@media (max-width:700px){.wrap{padding:var(--s5) var(--s4) var(--s7)}}
.page-head{max-width:46rem;margin-bottom:var(--s6)}
.page-head h1{font-size:clamp(2rem,4.2vw,3.25rem);font-weight:800}
.page-head p{font-size:1.125rem;color:var(--muted);margin-top:var(--s3)}
.kicker{display:inline-block;font-weight:700;color:var(--brick-dark);margin-bottom:var(--s2);font-size:.9375rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5)}
.note{display:flex;gap:var(--s3);align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:.9375rem}
.note svg{flex:none;margin-top:3px}
.note.green{background:var(--green-soft);border-color:transparent}
.note.brick{background:var(--brick-soft);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:2px 10px;font-size:.8125rem;font-weight:700;background:var(--line-soft);color:var(--ink);white-space:nowrap}
.tag.demo{background:var(--clay-soft);color:var(--brick-dark)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--brick-soft);color:var(--brick-dark)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4)}
.field label,.field .lbl{font-weight:700;font-size:.9375rem}
.field .hint{font-size:.875rem;color:var(--muted)}
.field label.choice{font-weight:400}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--brick-soft)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.875rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.off{background:transparent;color:var(--muted)}
.chip.off .dot{opacity:.35}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:.8125rem;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1.5px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
code{font-size:.875em;background:var(--line-soft);padding:1px 6px;border-radius:4px}

/* ---------- MAPA ---------- */
.map-page{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 64px);min-height:620px}
.filters{padding:var(--s5)}
.filters h2{font-size:1.125rem;font-weight:700;margin:var(--s5) 0 var(--s2)}
.filters h2:first-child{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:var(--s4)}
.stats div{background:var(--paper);border-radius:var(--r-md);padding:10px;font-size:.8125rem;color:var(--muted);line-height:1.25}
.stats b{display:block;font:800 1.75rem/1 var(--display);color:var(--ink);font-stretch:80%}
.how{font-size:.9375rem;color:var(--muted);padding-left:1.2em;margin:0}
.how li{margin:4px 0}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:6px 0;cursor:pointer}
.toggle input{width:20px;height:20px;margin-top:3px;accent-color:var(--brick)}
.toggle small{display:block;color:var(--muted);font-size:.8125rem}
.filters-col{min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
.map-col{display:flex;flex-direction:column;min-height:0}
.map-area{position:relative;overflow:hidden;background:#DCDDD5;flex:1;min-height:0}
.chip.ph[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--ink)}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-bar{position:absolute;top:var(--s3);left:var(--s3);right:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;pointer-events:none}
.map-bar>*{pointer-events:auto}
.terrs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
@media (min-width:901px){.terrs{flex-wrap:wrap;overflow:visible}}
.terrs .chip{flex:none;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:var(--r-pill);padding:0 6px 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.search input{border:0;background:none;min-height:44px;width:min(260px,52vw);outline:none}
.search span{font-size:.8125rem;color:var(--muted);font-weight:700;padding-right:8px;white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;width:44px;height:52px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 3px 3px rgba(35,28,24,.4));transition:transform .15s}
.pin[aria-pressed="true"]{transform:translate(-50%,-100%) scale(1.25);z-index:3}
.pin text{font:800 11px var(--display);fill:#fff}
.perim{white-space:nowrap;position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--ink);color:#fff;border:3px solid #fff;font-weight:700;font-size:.875rem;cursor:pointer;box-shadow:var(--shadow);z-index:2}
.perim[aria-pressed="true"]{border-color:var(--clay)}
.ring{position:absolute;transform:translate(-50%,-50%);border:2.5px dashed var(--ink);border-radius:50%;pointer-events:none;background:rgba(164,71,42,.07)}
.ring span{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:var(--r-pill)}
.legend{position:absolute;left:var(--s3);bottom:var(--s3);background:#fff;border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--shadow);font-size:.8125rem;max-width:calc(100% - 2*var(--s3))}
.legend ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.legend li{display:flex;align-items:center;gap:6px}
.ficha{position:absolute;top:var(--s3);right:var(--s3);bottom:var(--s3);width:360px;background:#fff;border-radius:var(--r-lg);box-shadow:0 20px 50px -20px rgba(35,28,24,.55);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.ficha-head{padding:var(--s4) var(--s5) 0;position:relative}
.ficha-head h2{font-size:1.625rem;font-weight:800;padding-right:40px}
.ficha-head .close{position:absolute;right:10px;top:10px}
.ficha-body{padding:var(--s3) var(--s5) var(--s5);overflow:auto;flex:1}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:0;background:var(--paper);cursor:pointer}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:var(--s3) 0 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;min-height:44px;padding:0 12px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brick)}
.near{list-style:none;padding:0;margin:var(--s2) 0 var(--s4)}
.near button{display:flex;gap:10px;width:100%;text-align:left;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--line-soft);cursor:pointer;min-height:44px}
.near button:hover b{text-decoration:underline}
.near small{display:block;color:var(--muted);font-size:.8125rem}
.kv{display:grid;grid-template-columns:7.5rem 1fr;gap:6px 10px;margin:var(--s3) 0;font-size:.9375rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.timeline-mini p{font-size:.9375rem;margin:0 0 var(--s3)}
.demo-flag{position:absolute;right:var(--s3);bottom:var(--s3);background:var(--clay);color:var(--ink);font-size:.8125rem;font-weight:700;border-radius:var(--r-pill);padding:4px 12px;z-index:4}
.ficha + .demo-flag{right:calc(360px + 2*var(--s3))}
@media (min-width:901px){.has-ficha .map-bar{right:calc(360px + 3*var(--s3))}}
.filters-toggle{display:none}
@media (max-width:900px){
  .map-page{grid-template-columns:1fr;height:auto;min-height:0}
  .filters-col{border-right:0}
  .filters{display:none;border-bottom:1px solid var(--line)}
  .filters.open{display:block}
  .filters-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:var(--s3) var(--s4);font-weight:700;min-height:52px;cursor:pointer}
  .map-area{height:62vh;min-height:440px;flex:none}
  .ficha{position:relative;inset:auto;width:auto;margin:var(--s3);border-radius:var(--r-lg)}
  .ficha + .demo-flag{right:var(--s3)}
  .legend{font-size:.75rem;padding:8px 10px}
  .demo-flag{display:none}
  .perim{font-size:.8125rem;padding:0 12px}
}

/* ---------- DENUNCIAR ---------- */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 var(--s6);counter-reset:s}
.steps li{flex:1}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--muted);font-weight:700;font-size:.875rem}
.steps button::before{content:"";display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.steps .done button{color:var(--ink)} .steps .done button::before{background:var(--green)}
.steps .cur button{color:var(--ink)} .steps .cur button::before{background:var(--brick)}
.steps button[disabled]{cursor:default}
.steps .n{font-family:var(--display);font-size:.8125rem;color:var(--muted)}
@media (max-width:700px){.steps .t{display:none}.steps .cur .t{display:inline}}
.report{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--s6);align-items:start}
@media (max-width:960px){.report{grid-template-columns:1fr}}
.step-title{font-size:clamp(1.75rem,3.4vw,2.5rem);font-weight:800;margin-bottom:var(--s2)}
.step-lead{color:var(--muted);font-size:1.0625rem;margin-bottom:var(--s5)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
@media (max-width:600px){.choices{grid-template-columns:1fr}}
.choice{position:relative;display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);cursor:pointer;min-height:44px}
.choice:hover{border-color:var(--muted)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#fff}
.choice.radio .box{border-radius:50%}
.choice b{display:block;font-size:1rem}
.choice small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.choice:has(input:checked){border-color:var(--brick);background:var(--brick-soft)}
.choice:has(input:checked) .box{background:var(--brick);border-color:var(--brick)}
.choice:has(input:checked) .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.choice.radio:has(input:checked) .box::after{width:8px;height:8px;border:0;background:#fff;border-radius:50%;transform:none}
.choice:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.nav-row{display:flex;gap:var(--s3);justify-content:space-between;align-items:center;margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
.diary{list-style:none;margin:0 0 var(--s3);padding:0}
.diary li{display:flex;gap:var(--s3);align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:6px}
.diary time{font-weight:700;white-space:nowrap;font-size:.875rem}
.diary span{flex:1;font-size:.9375rem}
.diary button{background:none;border:0;color:var(--brick-dark);font-weight:700;cursor:pointer;min-height:32px}
.diary-add{display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:end}
@media (max-width:600px){.diary-add{grid-template-columns:1fr}}
.warn-adj{margin-top:6px}
.meter{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);margin-bottom:var(--s4)}
.meter-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.meter-bar i{height:10px;border-radius:3px;background:var(--line-soft)}
.meter-bar i.on{background:var(--green)}
.meter b{font-family:var(--display);font-size:1.25rem}
.meter small{color:var(--muted);display:block}
/* the slip */
.slip-col{position:sticky;top:88px}
@media (max-width:960px){.slip-col{position:static}}
.slip{background:#fff;border-radius:var(--r-sm);box-shadow:0 1px 0 var(--line),0 24px 40px -24px rgba(35,28,24,.5);position:relative;overflow:hidden}
.slip::before{content:"";display:block;height:14px;background:radial-gradient(circle at 7px 0,var(--paper) 6px,transparent 6.5px) 0 0/14px 14px repeat-x}
.slip-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:var(--s2) var(--s5) var(--s3);border-bottom:2px dashed var(--line)}
.slip-head h2{font-size:1.25rem;font-weight:800}
.slip-body{padding:var(--s4) var(--s5) var(--s5);font-size:.9375rem;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;min-height:200px}
.slip-body .hole{background:var(--clay-soft);border-bottom:2px dashed var(--brick);padding:0 4px;color:var(--brick-dark);font-weight:700;white-space:nowrap}
.slip textarea{display:block;width:100%;border:0;padding:var(--s4) var(--s5) var(--s5);min-height:420px;font:inherit;font-size:.9375rem;line-height:1.65;resize:vertical;outline:none}
.slip textarea:focus{box-shadow:inset 0 0 0 3px var(--brick-soft)}
.slip-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.privacy{font-size:.875rem;color:var(--muted);margin-top:var(--s3);display:flex;gap:8px}
.channel-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s4)}
.next{list-style:none;padding:0;margin:0;counter-reset:n}
.next li{display:grid;grid-template-columns:40px 1fr;gap:var(--s3);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.next li::before{counter-increment:n;content:counter(n);width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:800 1rem var(--display)}
.next li.ok::before{content:"✓";background:var(--green)}
.next h3{font-size:1.1875rem;font-weight:700;margin-bottom:4px}
.next p{color:var(--muted);font-size:.9375rem;margin:0 0 8px}
.check-line{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.875rem;cursor:pointer}
.check-line input{width:20px;height:20px;accent-color:var(--green)}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-weight:700;z-index:200;transition:transform .25s}
.toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
.inline-check{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);margin:var(--s4) 0}
.verdict{margin-top:var(--s3);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-weight:700}
.verdict.bad{background:var(--brick-soft);color:var(--brick-dark)}
.verdict.good{background:var(--green-soft);color:var(--green)}

/* ---------- GUIA ---------- */
.guide-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--s6);align-items:center;margin-bottom:var(--s7)}
@media (max-width:860px){.guide-hero{grid-template-columns:1fr}}
.cover{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:var(--s6);aspect-ratio:3/4;max-height:520px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.cover h2{font-size:clamp(2.5rem,5vw,4rem);font-weight:800;font-stretch:70%;line-height:.95}
.cover p{color:var(--header-muted);font-size:1.125rem}
.cover svg.bg{position:absolute;right:-40px;bottom:-40px;opacity:.16}
@media (max-width:860px){.cover{aspect-ratio:auto;max-height:none;gap:var(--s5);padding:var(--s5)}.cover svg.bg{width:200px;height:200px}}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s5)}
@media (max-width:600px){.toc{grid-template-columns:1fr}}
.toc a{display:flex;justify-content:space-between;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}
.toc a span{color:var(--brick-dark);font-family:var(--display);white-space:nowrap}
.toc a:hover{color:var(--brick-dark)}
.section-title{font-size:clamp(1.5rem,3vw,2.25rem);font-weight:800;margin:var(--s7) 0 var(--s2)}
.section-lead{color:var(--muted);max-width:44rem;margin-bottom:var(--s5)}
.acc{border-top:1.5px solid var(--ink)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s4) 0;cursor:pointer;font:700 1.1875rem/1.3 var(--body)}
.acc summary::-webkit-details-marker{display:none}
.acc summary small{font:700 .875rem var(--display);color:var(--brick-dark);white-space:nowrap;margin-left:auto}
.acc summary::after{content:"+";font:400 1.75rem/1 var(--display);width:24px;text-align:center;flex:none}
.acc details[open] summary::after{content:"−"}
.acc .body{padding:0 0 var(--s5);max-width:46rem}
.acc ul{padding-left:1.2em;margin:0 0 var(--s3)}
.acc li{margin:4px 0}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media (max-width:600px){.dodont{grid-template-columns:1fr}}
.dodont>div{border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.dodont .yes{background:var(--green-soft)} .dodont .no{background:var(--brick-soft)}
.dodont h4{font-size:1.0625rem;margin-bottom:6px}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
@media (max-width:760px){.quiz{grid-template-columns:1fr}}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.q p{font-weight:700;font-size:1.0625rem;margin-bottom:var(--s3)}
.q .seg .chip{min-width:72px;justify-content:center}
.q .ans{margin-top:var(--s3);font-size:.9375rem;border-radius:var(--r-md);padding:10px 12px}
.q .ans.right{background:var(--green-soft)} .q .ans.wrong{background:var(--brick-soft)}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5)}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.big-num{font:800 clamp(2rem,4vw,3rem)/1 var(--display);font-stretch:80%}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
@media (max-width:900px){.channels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.channels{grid-template-columns:1fr}}
.channel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.channel h3{font-size:1.1875rem;font-weight:700}
.channel p{font-size:.9375rem;color:var(--muted);margin:0;flex:1}
.channel a{font-weight:700;font-size:.9375rem}
.gloss-list{columns:2;column-gap:var(--s6)}
@media (max-width:700px){.gloss-list{columns:1}}
.gloss-list div{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.gloss-list dt{font-weight:700} .gloss-list dd{margin:2px 0 0;color:var(--muted);font-size:.9375rem}
.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s5)}
.figures div{border-top:3px solid var(--ink);padding-top:var(--s2);font-size:.9375rem;color:var(--muted)}
.figures b{display:block;font:800 2rem/1.1 var(--display);color:var(--ink);font-stretch:80%}
@media (max-width:600px){.figures{grid-template-columns:1fr}}

/* ---------- JURÍDICO / DADOS ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 var(--s5) var(--s6)}
.tl li::before{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--brick)}
.tl .when{font:800 1.125rem var(--display);font-stretch:85%}
.tl .card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);margin-top:var(--s2)}
.tl .card h3{font-size:1.1875rem;font-weight:700;font-family:var(--body);line-height:1.35;margin-bottom:var(--s2)}
.tl dl{display:grid;grid-template-columns:7rem 1fr;gap:4px 12px;font-size:.9375rem;margin:0 0 var(--s3)}
.tl dt{color:var(--muted)} .tl dd{margin:0}
.law{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.law h3{font-size:1.125rem;font-weight:700;font-family:var(--body);margin-bottom:6px}
.law p{font-size:.9375rem;color:var(--muted);margin:0}
.progress{height:12px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin:var(--s2) 0}
.progress i{display:block;height:100%;background:var(--green);border-radius:6px}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto}
.method{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
@media (max-width:760px){.method{grid-template-columns:1fr}}
.method article{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5)}
.method h2{font-size:1.375rem;font-weight:800;margin-bottom:var(--s2)}

.parts{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.part-link{display:grid;grid-template-columns:56px 1fr auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.part-link b{display:block;font-size:1.0625rem;line-height:1.3}
.part-link small{display:block;color:var(--muted);font-size:.875rem;line-height:1.4;margin-top:2px}
.part-link:hover b{color:var(--brick-dark)}
.part-n{font:800 2.75rem/1 var(--display);font-stretch:70%;color:var(--brick)}
.part-p{font:700 .875rem var(--display);color:var(--brick-dark);white-space:nowrap}
.part{margin-top:var(--s8);scroll-margin-top:88px}
.part-head{display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:end;margin-bottom:var(--s5)}
.part-big{font:800 clamp(5rem,12vw,9rem)/.8 var(--display);font-stretch:62%;color:var(--brick)}
@media (max-width:600px){.part-head{grid-template-columns:1fr;gap:var(--s2)}.part-big{font-size:4.5rem}}
.part-tool{margin-top:var(--s6)}
.tool-title{font-size:1.5rem;font-weight:800;margin-bottom:var(--s2)}
.acc details{scroll-margin-top:88px}
.dodont .neutral{background:var(--surface);border:1px solid var(--line)}
.checks{list-style:none;padding:0}
.checks li{position:relative;padding-left:28px;margin:8px 0}
.checks li::before{content:"";position:absolute;left:2px;top:4px;width:16px;height:16px;border:2px solid var(--green);border-radius:4px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4)}
.quote .lbl{display:block;font-weight:700;font-size:.875rem;color:var(--muted);margin-bottom:6px}
.quote .hole{background:var(--clay-soft);border-bottom:2px dashed var(--brick);padding:0 4px;color:var(--brick-dark);font-weight:700}
/* Denunciar: attention pulse once + megaphone waves */
.cta-anim{position:relative;isolation:isolate}
.cta-anim::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(248,232,222,.7);z-index:-1;pointer-events:none}
.cta-anim.pulse::after{animation:ctaPulse 1.6s cubic-bezier(.2,.6,.3,1) 2}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(248,232,222,.7)}100%{box-shadow:0 0 0 16px rgba(248,232,222,0)}}
.cta-anim .w1,.cta-anim .w2{opacity:.0;transition:opacity .2s}
.cta-anim .w1{opacity:1}
.cta-anim:hover .w1,.cta-anim:focus-visible .w1,.cta-anim.pulse .w1{animation:wave 1s ease-in-out infinite}
.cta-anim:hover .w2,.cta-anim:focus-visible .w2,.cta-anim.pulse .w2{animation:wave 1s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:0}40%,70%{opacity:1}}
.cta-anim svg{transform-origin:30% 50%}
.cta-anim:hover svg{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.cta-anim::after,.cta-anim .w1,.cta-anim .w2,.cta-anim svg{animation:none!important}.cta-anim .w2{opacity:1}}

.contact{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:var(--s5);align-items:start}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.contact-topics{grid-template-columns:1fr}
.mailcard{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s3)}
.mailcard .lbl{display:block;color:var(--header-muted);font-size:.875rem;margin-bottom:6px}
.mailcard a{color:var(--clay);font:800 1.375rem/1.2 var(--display);font-stretch:85%;word-break:break-all;text-decoration:none}
.mailcard a:hover{text-decoration:underline}

.mailcard .mail-addr{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--clay);font:800 1.375rem/1.2 var(--display);font-stretch:85%;word-break:break-all;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.mailcard .mail-addr:hover{color:#fff}
.mailcard .mail-addr:focus-visible{outline-color:var(--clay)}
.mailcard .mail-hint{display:block;color:var(--header-muted);font-size:.8125rem;margin-top:6px}
.pop-ov{position:fixed;inset:0;z-index:300;background:rgba(35,28,24,.55);display:flex;align-items:center;justify-content:center;padding:var(--s4);animation:popFade .15s ease-out}
.pop{position:relative;background:var(--surface);border-radius:var(--r-lg);width:min(440px,100%);padding:var(--s5);box-shadow:0 30px 60px -20px rgba(35,28,24,.6);animation:popIn .18s ease-out}
.pop h2{font-size:1.5rem;font-weight:800;padding-right:44px;margin-bottom:var(--s2)}
.pop-x{position:absolute;right:12px;top:12px}
.pop-to{font-size:.9375rem;margin-bottom:var(--s4);word-break:break-word}
.pop-to span{color:var(--muted);font-size:.875rem}
.pop-list{display:flex;flex-direction:column;gap:8px}
.pop-opt{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer;font:inherit}
.pop-opt:hover{border-color:var(--ink);background:var(--paper)}
.pop-opt b{display:block;font-size:1rem}
.pop-opt small{display:block;color:var(--muted);font-size:.8125rem}
.pop-ic{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 1rem var(--display);color:#fff}
.pop-ic.g{background:var(--brick)} .pop-ic.o{background:var(--green)} .pop-ic.a{background:var(--ink)} .pop-ic.c{background:var(--clay);color:var(--ink)}
.pop-note{font-size:.875rem;color:var(--muted);margin:var(--s3) 0 0}
@keyframes popFade{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:560px){.pop-ov{align-items:flex-end;padding:0}.pop{border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}}

.brand .mark{overflow:visible}
.brand .lens-g{transform-box:view-box}
.brand .find{transform-box:fill-box;transform-origin:center}
.brand.scan .lens-g{animation:lensScan 1.4s cubic-bezier(.45,.05,.25,1) both}
.brand.scan .find{animation:findPop 1.4s ease-out both}
@keyframes lensScan{0%{transform:translate(-22px,24px)}30%{transform:translate(-22px,2px)}62%{transform:translate(-6px,26px)}100%{transform:translate(0,0)}}
@keyframes findPop{0%,78%{opacity:0;transform:scale(.6)}90%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.brand.scan .lens-g,.brand.scan .find{animation:none}}

.ml-map{position:absolute;inset:0}
.map-area.live{background:#E9EAE4}
.mlpin{background:none;border:0;padding:0;cursor:pointer;width:44px;height:52px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 3px 3px rgba(35,28,24,.4));transition:transform .15s;transform-origin:50% 100%}
.mlpin[aria-pressed="true"]{transform:scale(1.25)}
.mlpin text{font:800 11px var(--display)}
.mlpin-wrap.sel{z-index:3}
.perim.ml{position:static;transform:none}
.ring-lbl{background:var(--ink);color:#fff;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:var(--r-pill);pointer-events:none;white-space:nowrap}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.map-area .maplibregl-ctrl-bottom-right{transition:right .2s}
@media (min-width:901px){.has-ficha .maplibregl-ctrl-bottom-right{right:384px}}
.maplibregl-ctrl-attrib{font-size:11px}
.map-area.live .legend{bottom:var(--s3)}
@media (max-width:900px){.map-area.live .legend{max-width:calc(100% - 72px)}}
.foot{border-top:1px solid var(--line);margin-top:var(--s7);padding:var(--s5) 0 0;font-size:.875rem;color:var(--muted)}
</style>
</head>

<div class="toast" role="status" aria-live="polite" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
"use strict";
/* ================= DATA ================= */
var PHASES = {
  "proposta":{c:"var(--ph-proposta)",hex:"#E2A07E",g:"P"},
  "em aprovação":{c:"var(--ph-aprov)",hex:"#C2652F",g:"A"},
  "em obras":{c:"var(--ph-obras)",hex:"#7E3420",g:"O"},
  "entregue":{c:"var(--ph-entregue)",hex:"#2F5D50",g:"E"}

  r.diary.forEach(function(e){facts.push((e.when?fmtDT(e.when)+": ":"")+e.what)});
  r.signs.forEach(function(s){facts.push(s+".")});

  var cc=k==="preco"?capCheck(r.cap):null;

  var basis={
    temporada:"Com base no Decreto Municipal 64.244/2025, art. 7º, VII, comunico possível uso irregular de unidade(s) de Habitação de Interesse Social (HIS) por locação de curta duração (temporada).",
    preco:"Comunico possível venda ou locação de unidade(s) de Habitação de Interesse Social (HIS) acima do preço máximo ou do limite de aluguel previstos nos Decretos Municipais 64.244/2025 e 64.895/2026.",
    renda:"Comunico possível venda ou locação de unidade(s) de Habitação de Interesse Social (HIS) sem verificação da faixa de renda (ateste de renda da SEHAB), conforme o Decreto Municipal 63.130/2024 e o Decreto 64.244/2025.",
    hotel:"Com base no Decreto Municipal 64.244/2025, comunico possível uso de unidade(s) de Habitação de Interesse Social (HIS) como hotel, hostel ou flat, o que não corresponde à destinação de moradia social.",

  }else if(ch==="sindico"){

  }

      ["pode","O que pode e o que não pode","p. 5",'<div class="dodont"><div class="yes"><h4>Pode</h4><ul><li>Morar na unidade, com renda dentro da faixa</li><li>Alugar por contrato residencial de longa duração, com aluguel de até 30% da renda da faixa</li><li>Vender depois, respeitando o preço máximo e os 10 anos de proteção</li></ul></div><div class="no"><h4>Não pode</h4><ul><li>Anunciar ou alugar por temporada (Airbnb, Booking e similares)</li><li>Vender acima do preço máximo</li><li>Vender ou alugar para quem não comprova a renda</li><li>Usar a unidade como hotel, hostel ou flat</li></ul></div></div><p style="margin-top:var(--s3)">A temporada é proibida pelo Decreto 64.244/2025. As sanções recaem sobre quem descumpre, não sobre quem denuncia.</p>'],
      ["sinais","Sinais de alerta","p. 6",'<p>Um sinal de alerta não é prova: mostra que vale observar com mais cuidado. Quanto mais sinais no mesmo prédio, mais forte é o caso.</p><ol><li>Novas pessoas a cada poucos dias com bagagens.</li><li>Cofres de chave na portaria ou senha de fechadura trocada a cada estadia.</li><li>Anúncio online com fotos do prédio, preço por diária e avaliações de hóspedes.</li><li>Várias unidades do mesmo prédio anunciadas pelo mesmo perfil ou empresa.</li><li>Venda sem dizer a categoria da unidade, com preço acima do máximo ou com pressa.</li></ol>'+note("","alert","<b>Cuidado:</b> apartamento pequeno, caro ou alugado não é prova de irregularidade. Denuncie fatos, nunca pessoas.")],
      ["denunciar","Como denunciar em 3 passos","p. 7",'<ol><li><b>Anote os fatos.</b> Endereço, data, horário e o que você viu. Se for anúncio, guarde o print da página inteira e o link. Fotografe sem mostrar o rosto de ninguém.</li><li><b>Registre no 156.</b> Descreva os fatos, anexe os arquivos e cite “HIS” e o Decreto 64.244/2025, se for temporada. Anote o número do protocolo.</li><li><b>Cobre com o protocolo.</b> Use o número para pedir andamento à SEHAB e à Ouvidoria. Sem resposta, ou em caso grave: Ministério Público, Defensoria e Conselho Gestor da ZEIS.</li></ol>'+note("brick","alert","<b>Nunca:</b> entrar em apartamento, fazer reserva falsa ou postar nome ou foto de alguém. Se sentir ameaçado, ligue 190 e registre boletim de ocorrência.")+'<a class="btn btn-primary" style="margin-top:var(--s4)" href="#/denunciar">Montar minha denúncia agora</a>'],
      ["canais","Onde denunciar","p. 8",channelList(false)+'<p style="margin-top:var(--s3);font-size:.9375rem;color:var(--muted)">Telefones, endereços e formulários podem mudar. Confirme nos sites oficiais. Em risco imediato, ligue 190.</p>'],
      ["direitos","Seus direitos","p. 9",'<ul><li>Pedir providências a qualquer órgão público, de graça e sem advogado.</li><li>Pedir informações à Prefeitura, sem explicar o motivo. O órgão tem 20 dias para responder (Lei de Acesso à Informação).</li><li>Receber protocolo e resposta, e cobrar a Ouvidoria se demorar.</li><li>Pedir sigilo da sua identidade ao registrar no 156 ou na Ouvidoria.</li><li>Denunciar de boa-fé sem ser punido. Se houver ameaça, faça B.O. e procure o Ministério Público ou a Defensoria.</li></ul><p><b>Quem denuncia não precisa provar tudo.</b> Apurar é trabalho do poder público. Você apresenta indícios claros: um endereço, um anúncio, uma descrição dos fatos.</p>']
    ],tool:'<h3 class="tool-title">Isso é irregular?</h3><p class="section-lead">Responda e veja na hora.</p><div class="quiz">'+QUIZ.map(function(q,i){var a=g.quiz[i];return '<div class="q"><p>'+q.q+'</p><div class="seg">'+[["s","Sim",true],["n","Não",false]].map(function(o){return '<button class="chip" aria-pressed="'+(a===o[2])+'" data-act="quiz" data-i="'+i+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'+(a!==undefined?'<div class="ans '+(a===q.a?"right":"wrong")+'" role="status"><b>'+(a===q.a?"Isso mesmo. ":"Na verdade, não. ")+'</b>'+q.e+'</div>':'')+'</div>'}).join("")+'</div>'},
    {n:2,id:"parte-2",t:"Compra e venda de HIS",d:"Quem pode comprar ou morar, as quatro travas, preço máximo e o que fazer se uma incorporadora procurar você.",p:"p. 10",topics:[
      ["renda","Quem pode comprar ou morar?","p. 11",'<p>Depende da renda mensal de toda a família:</p><div class="table-wrap"><table><tr><th>Categoria</th><th>Renda da família por mês</th><th>Renda por pessoa</th></tr>'+Object.keys(CAPS).map(function(k){var c=CAPS[k];return '<tr><td><b>'+k+'</b></td><td>até '+brl(c.renda).replace(",00","")+' ('+c.sm+' salários mínimos)</td><td>até '+brl(c.pc)+'</td></tr>'}).join("")+'</table></div><p style="margin-top:var(--s3);font-size:.9375rem;color:var(--muted)">Valores de janeiro de 2026. Eles mudam todo ano: confirme na SEHAB. Quem não tem renda própria pode se enquadrar se fizer parte de uma família que sustenta essa pessoa.</p>'],
      ["travas","As 4 travas que protegem a moradia social","p. 12",'<ol><li><b>Ateste de renda.</b> Documento da SEHAB que confirma que a família se encaixa na faixa. Precisa existir antes de assinar o contrato.</li><li><b>Proteção de 10 anos.</b> O cartório anota na matrícula do imóvel que a unidade é HIS por 10 anos. A Prefeitura é avisada de qualquer negócio.</li><li><b>Preço máximo de venda.</b> Cada categoria tem um teto, corrigido todo ano.</li><li><b>Aluguel limitado.</b> No máximo 30% da renda da faixa da unidade, e só em contrato residencial de longa duração.</li></ol>'],
      ["teto","Preço máximo, aluguel e fila","p. 13",'<div class="table-wrap"><table><tr><th>Preço máximo de venda em 2026</th><th></th></tr><tr><td><b>HIS-1</b></td><td>'+brl(c1.venda)+'</td></tr><tr><td><b>HIS-2</b></td><td>'+brl(c2.venda)+'</td></tr><tr><td><b>HMP</b></td><td>'+brl(c3.venda)+'</td></tr></table></div><p style="margin-top:var(--s3)">Cobrar um valor “por fora” para passar o preço do teto também é irregular.</p><p><b>Aluguel:</b> na HIS-1, a renda máxima é R$ 4.863, e 30% disso dá cerca de R$ 1.459. Contrato residencial de longa duração é permitido; temporada e contratos de menos de 90 dias, não.</p><p><b>Atenção às famílias na fila:</b> antes de vender uma HIS-1, a empresa deve avisar a SEHAB, que tem 30 dias para indicar famílias inscritas nos programas públicos. Venda sem esse aviso merece pergunta.</p>'],
      ["assinar","Vai comprar ou alugar uma HIS?","p. 14",'<ul class="checks"><li>Exija o Ateste de renda antes de assinar qualquer contrato.</li><li>Confira se o preço está dentro do teto da categoria.</li><li>Peça a certidão de matrícula e veja a anotação dos 10 anos.</li><li>Desconfie de “taxa de cessão” ou de pagamento por fora.</li><li>Se for alugar, o contrato deve ser residencial, de longa duração, com aluguel de até 30%.</li><li>Guarde contrato, propaganda e conversas com o corretor.</li></ul><p>Dúvida sobre contrato ou ameaça de despejo? Procure a Defensoria Pública.</p>'],
      ["incorporadora","Se uma incorporadora procurar você","p. 15",'<p>Incorporadoras e corretores podem procurar moradores para comprar casas e terrenos. Vender é uma escolha sua, e ninguém é obrigado a vender. A pressão costuma ser maior sobre pessoas idosas e sobre quem mora sozinho.</p><h4 style="font-size:1.0625rem;margin-bottom:6px">Sinais de pressão</h4><ul><li>Visitas, ligações e recados muito frequentes.</li><li>Frases como “todos os vizinhos já venderam”.</li><li>Pressa para assinar.</li><li>Pedido para não contar nada aos vizinhos.</li><li>Proposta de trocar a casa por apartamentos “no prédio que vai ser construído”, sem garantias claras.</li></ul>'],
      ["proposta","Se a proposta chegar: o que fazer","p. 16",'<ol><li>Não decida nem assine nada na hora. Peça um tempo para pensar.</li><li>Peça a proposta por escrito: valor, prazos, forma de pagamento, nome da empresa e CNPJ.</li><li>Mostre os papéis a um advogado de confiança ou à Defensoria Pública antes de assinar qualquer coisa.</li><li>Cuidado com o “compromisso de venda” e com o pedido de sigilo. Podem criar obrigações para você e impedir que os vizinhos comparem valores.</li><li>Na permuta, exija contrato claro, com prazo de entrega, tamanho e localização das unidades e garantias.</li><li>Anote tudo e converse com a associação de moradores.</li></ol>'+note("brick","alert","Se houver assédio, ameaça ou mentira, registre um boletim de ocorrência e procure a Defensoria Pública ou o Ministério Público. Pessoas idosas têm proteção especial no Estatuto da Pessoa Idosa (Lei 10.741/2003).")]
    ],tool:'<h3 class="tool-title">Calculadora de teto</h3><p class="section-lead">Viu um anúncio de venda ou aluguel de HIS? Compare com o limite da categoria.</p><div class="calc"><div class="panel">'+capWidget(g.calc,"guia")+'</div><div class="panel" style="background:var(--ink);color:#fff;border-color:var(--ink)"><p style="color:var(--header-muted);margin-bottom:var(--s2)">Limites de 2026</p>'+Object.keys(CAPS).map(function(k){var c=CAPS[k];return '<div style="display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid #4a3e37"><b style="font-family:var(--display);font-size:1.25rem">'+k+'</b><span style="text-align:right">'+brl(c.venda)+' venda<br><span style="color:var(--header-muted)">'+brl(c.renda*0.3)+' aluguel/mês</span></span></div>'}).join("")+'<p style="color:var(--header-muted);font-size:.875rem;margin:var(--s3) 0 0">Preços atualizados em 05/01/2026 pelo INCC. Confirme na SEHAB antes de agir.</p></div></div>'},
    {n:3,id:"parte-3",t:"Organização do bairro",d:"Obras, pedido de informações à Prefeitura em grupo e o exemplo de moradores que já se organizaram.",p:"p. 17",topics:[
      ["obras","Obras: barulho, calçada e trânsito","p. 18",'<p>Obra grande muda o dia a dia de quem mora perto. Você pode registrar e cobrar.</p><div class="dodont"><div class="neutral"><h4>Como registrar</h4><ul><li>Anote o endereço da obra, a data, o horário e o que aconteceu.</li><li>Fotografe a calçada, a rua e a placa da obra, sem mostrar o rosto de ninguém.</li><li>No barulho, anote o horário exato e por quanto tempo durou.</li><li>Combine com os vizinhos: vários registros do mesmo endereço mostram que o problema é coletivo.</li></ul></div><div class="neutral"><h4>Onde reclamar</h4><ul><li><b>Barulho:</b> 156 (Programa Silêncio Urbano, o Psiu).</li><li><b>Calçada bloqueada, rua interditada, entulho e lama:</b> 156 ou a subprefeitura.</li><li><b>Trânsito parado por caminhão ou concretagem:</b> 156 e CET.</li><li><b>Dúvida se a obra tem licença:</b> pergunte à subprefeitura, pelo 156, se existe alvará de execução.</li><li><b>Nada resolveu?</b> Use o protocolo, procure a Ouvidoria, a associação de moradores e, se for grave, o Ministério Público.</li></ul></div></div><a class="btn btn-ghost" style="margin-top:var(--s4)" href="#/denunciar" data-act="startObra">Registrar problema com obra</a>'],
      ["lai","Peça informações à Prefeitura, em grupo","p. 19",'<p>Pela Lei de Acesso à Informação (Lei 12.527/2011), qualquer pessoa, associação ou conselho pode pedir dados à Prefeitura sem justificar. O prazo de resposta é de 20 dias, prorrogável por mais 10. Se negarem ou não responderem, cabe recurso: acompanhe pelo protocolo.</p><div class="quote"><span class="lbl">Modelo de pedido</span><p>“Com base na Lei 12.527/2011, solicito à Secretaria Municipal de Habitação, para a região de <span class="hole">subprefeitura ou bairro</span>: (1) a lista de empreendimentos com unidades HIS e HMP, com a categoria de cada um; (2) o número de processos de fiscalização abertos e de sanções aplicadas por empreendimento desde 2024; (3) quantas Certidões de Ateste de renda foram emitidas nesses empreendimentos; (4) quantas denúncias de locação por temporada foram recebidas e qual o andamento delas.”</p><button class="btn btn-dark btn-sm" data-act="copyLAI">Copiar modelo</button></div><p style="margin-top:var(--s3)">Faça o pedido pelo Serviço de Informação ao Cidadão (SIC), acessível pelo portal do SP156, e peça a resposta em planilha. Se pedir hoje, a resposta vence em <b>'+fmtD(new Date(Date.now()+20*864e5))+'</b> (até '+fmtD(new Date(Date.now()+30*864e5))+' com prorrogação).</p>'],
      ["organizar","Quem já está se organizando?","p. 20",'<p>Você não está sozinho. Moradores já se organizam para defender a qualidade de vida e acompanhar o que acontece com as obras e com a moradia.</p><div class="grid2"><div class="channel"><h3>Associação dos Moradores da Vila Mariana (AVM)</h3><p>Reúne moradores que acompanham obras, a preservação do bairro e as políticas públicas. Já questionou obras sobre nascentes e prédios que avançavam sobre a calçada.</p><a href="https://www.instagram.com/associacaovilamariana/" target="_blank" rel="noopener">@associacaovilamariana</a></div><div class="channel"><h3>Coletivo Chácara das Jaboticabeiras</h3><p>Grupo de moradores que se uniu para proteger um conjunto de ruas com casas, árvores e história. Organiza passeios pelo bairro que chamam a atenção de instituições como o Sesc.</p><a href="https://www.instagram.com/chacaradasjaboticabeiras/" target="_blank" rel="noopener">@chacaradasjaboticabeiras</a></div></div>']
    ],tool:''}
  ];
  return '<div class="wrap">'+
  '<section class="guide-hero"><div class="cover"><svg class="bg" width="300" height="300" viewBox="14 8 86 86" aria-hidden="true"><defs><clipPath id="cov-lens"><circle cx="64" cy="44" r="22"/></clipPath></defs><rect x="18" y="14" width="64" height="4" rx="1" fill="#F8E8DE"/><rect x="20" y="21" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="52" y="21" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="20" y="35" width="12" height="11" rx="1.5" fill="#C9583A"/><rect x="36" y="35" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="68" y="35" width="12" height="11" rx="1.5" fill="#C9583A"/><rect x="20" y="49" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="52" y="49" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="20" y="63" width="12" height="11" rx="1.5" fill="#C9583A"/><rect x="36" y="63" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="68" y="63" width="12" height="11" rx="1.5" fill="#C9583A"/><rect x="20" y="77" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="52" y="77" width="28" height="11" rx="1.5" fill="#C9583A"/><rect x="28" y="33" width="12" height="12" rx="1.5" fill="#231C18"/><rect x="60" y="33" width="12" height="12" rx="1.5" fill="#231C18"/><rect x="28" y="62" width="12" height="12" rx="1.5" fill="#231C18"/><rect x="60" y="62" width="12" height="12" rx="1.5" fill="#231C18"/><line x1="81" y1="61" x2="93" y2="75" stroke="#F8E8DE" stroke-width="10" stroke-linecap="round"/><circle cx="64" cy="44" r="22" fill="#3A2E28"/><g clip-path="url(#cov-lens)"><rect x="36" y="20" width="26" height="13" rx="2" fill="#C9583A"/><rect x="66" y="20" width="26" height="13" rx="2" fill="#C9583A"/><rect x="28" y="37" width="18" height="13" rx="2" fill="#C9583A"/><rect x="50" y="37" width="26" height="13" rx="2" fill="#E2A07E"/><rect x="80" y="37" width="18" height="13" rx="2" fill="#C9583A"/><rect x="36" y="54" width="26" height="13" rx="2" fill="#C9583A"/><rect x="66" y="54" width="26" height="13" rx="2" fill="#C9583A"/><rect x="68" y="16" width="20" height="20" rx="2.5" fill="#100C0A"/></g><circle cx="64" cy="44" r="22" fill="none" stroke="#F8E8DE" stroke-width="7"/></svg><div style="position:relative"><p style="color:var(--clay);font-weight:700;margin-bottom:var(--s3)">Moradia popular em São Paulo</p><h2>Guia do<br>Morador</h2></div><p style="position:relative">Moradia popular é para quem precisa. Como perceber quando a HIS do seu bairro está sendo usada de forma errada, e o que fazer a respeito.</p></div>'+

  '<section class="part" id="glossario"><h2 class="section-title" style="margin-top:0">Palavras difíceis</h2><div class="field" style="max-width:420px"><label for="gq">Procurar no glossário</label><input class="input" id="gq" type="search" data-in="gq" value="'+esc(g.gq)+'" placeholder="Ex.: matrícula, ateste"></div>'+
  '<dl class="gloss-list">'+(gl.length?gl.map(function(x){return '<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>'}).join(""):'<p>Nenhuma palavra encontrada. Tente outro termo.</p>')+'</dl></section>'+
  '<p class="foot">Este guia é material informativo e não substitui orientação jurídica. Preços máximos, faixas de renda, números e canais de atendimento podem mudar: antes de agir, confirme nos sites oficiais, na SEHAB ou na Defensoria Pública. Fontes: Lei 16.050/2014 e Lei 17.975/2023; Decretos 63.130/2024, 64.244/2025 e 64.895/2026; SEHAB/Prefeitura de São Paulo; relatório da CPI da HIS (2025-2026); Constituição Federal e Leis 10.257/2001, 12.527/2011, 13.460/2017 e 10.741/2003; análise da AASP (2025).</p>'+

  '<div class="seg" style="margin-bottom:var(--s5)" role="group" aria-label="Filtrar registros">'+[["todos","Todos"],["Judicial","Judicial"],["Patrimônio","Patrimônio"]].map(function(o){return '<button class="chip" aria-pressed="'+(f===o[0])+'" data-act="jurf" data-k="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'+
  '<ol class="tl">'+list.map(function(j,i){return '<li><span class="when">'+esc(j.date)+'</span><div class="card"><h3>'+esc(j.reg)+'</h3><dl><dt>Instância</dt><dd>'+esc(j.inst)+'</dd><dt>Parte</dt><dd>'+esc(j.parte)+'</dd><dt>Status</dt><dd><span class="tag warn">'+esc(j.status)+'</span></dd><dt>Fonte</dt><dd>'+esc(j.fonte)+'</dd></dl><button class="btn btn-ghost btn-sm" data-act="cite" data-i="'+JUR.indexOf(j)+'">Copiar referência</button></div></li>'}).join("")+'</ol>'+
  '<h2 class="section-title">A lei por trás da denúncia</h2><p class="section-lead">O que cada norma garante, em uma frase. Cite o número na denúncia: ajuda quem recebe a classificar o caso.</p>'+
  '<div class="grid3">'+LAWS.map(function(l){return '<article class="law"><span class="tag" style="margin-bottom:var(--s2)">'+esc(l.n)+'</span><h3>'+esc(l.t)+'</h3><p>'+esc(l.d)+'</p></article>'}).join("")+'</div>'+
  '<div class="panel" style="margin-top:var(--s5)"><h3 style="font-size:1.375rem;margin-bottom:var(--s3)">O que acontece com quem descumpre</h3><div class="grid3"><div><b class="big-num" style="font-size:2.5rem">1</b><p>Devolve o valor da outorga onerosa que foi perdoado.</p></div><div><b class="big-num" style="font-size:2.5rem">2×</b><p>Paga multa de duas vezes o valor do potencial construtivo usado indevidamente.</p></div><div><b class="big-num" style="font-size:2.5rem">0</b><p>Perde os incentivos. As sanções recaem sobre quem descumpre, não sobre quem denuncia.</p></div></div></div>'+
  '<p class="foot">Este site não substitui orientação jurídica. Na dúvida, procure a Defensoria Pública.</p></div>';
}

/* ================= COBERTURA ================= */
function vCobertura(){
  var f=S.cob, loaded=LAYERS.filter(function(l){return l.ok}).length, checking=LAYERS.some(function(l){return l.checking});
  var list=LAYERS.filter(function(l){return f==="todas"||(f==="ok"?l.ok:!l.ok)});
  return '<div class="wrap"><div class="page-head"><span class="kicker">Transparência</span><h1>Cobertura de dados</h1><p>O que o mapa já tem e o que ainda falta carregar. Cada camada é um arquivo GeoJSON em WGS84, guardado na pasta <code>dados/</code> do site; quando o arquivo está lá, a camada aparece no mapa sozinha.</p></div>'+
  '<div class="panel" style="margin-bottom:var(--s5);max-width:560px"><b style="font-family:var(--display);font-size:1.5rem">'+loaded+' de '+LAYERS.length+' camadas carregadas</b><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+LAYERS.length+'" aria-valuenow="'+loaded+'"><i style="width:'+(loaded/LAYERS.length*100)+'%"></i></div><p style="color:var(--muted);font-size:.9375rem;margin:0">'+(checking?'Verificando os arquivos da pasta dados/…':'Uma das carregadas é de demonstração, com dados fictícios.')+'</p></div>'+
  '<div class="seg" style="margin-bottom:var(--s4)" role="group" aria-label="Filtrar camadas">'+[["todas","Todas"],["ok","Carregadas"],["falta","Sem arquivo"]].map(function(o){return '<button class="chip" aria-pressed="'+(f===o[0])+'" data-act="cobf" data-k="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'+
  '<div class="table-wrap"><table><thead><tr><th>Camada</th><th>Arquivo</th><th>Fonte provável</th><th>Status</th></tr></thead><tbody>'+list.map(function(l){return '<tr><td><b>'+esc(l.n)+'</b></td><td>'+(l.f?'<code>'+esc(DATA_DIR+l.f)+'</code>':'—')+'</td><td>'+esc(l.src)+'</td><td><span class="tag '+(l.ok?(l.builtin?"demo":"ok"):"")+'">'+esc(layerStatus(l))+'</span></td></tr>'}).join("")+'</tbody></table></div>'+
  '<div style="margin-top:var(--s5);max-width:46rem">'+note("green","info","Tem um desses arquivos ou sabe onde encontrar? <a href=\"#/contato\">Fale com a equipe do projeto</a>. Dados do GeoSampa podem ser pedidos também pela Lei de Acesso à Informação.")+'</div></div>';
}

/* ================= METODOLOGIA ================= */
function vMetodologia(){
  return '<div class="wrap"><div class="page-head"><span class="kicker">Como foi feito</span><h1>Metodologia</h1><p>Fontes, tratamento dos dados e limites do piloto.</p></div>'+
  '<div class="method">'+
  '<article><h2>Mapa e camadas</h2><p>O mapa usa a biblioteca MapLibre GL JS sobre o mapa-base público do OpenStreetMap. Cada camada é um arquivo GeoJSON em WGS84 (EPSG:4326) na pasta <code>dados/</code>; shapefiles são convertidos com ogr2ogr. O site procura os arquivos ao abrir: se um não existe, a camada aparece como “sem arquivo”.</p></article>'+
  '<article><h2>Perímetros e registros jurídicos</h2><p>Os perímetros têm ficha própria. Os registros jurídicos são curados à mão e ligados ao perímetro; cada um precisa ser conferido no ato oficial.</p></article>'+
  '<article><h2>Dados de demonstração</h2><p>A camada “HIS possíveis” é inventada: posições, nomes, fases e números não correspondem a empreendimentos reais. Serve para mostrar o mapa, a legenda e a contagem por raio na ficha.</p></article>'+
  '<article><h2>Limitações</h2><p>Os indicadores por perímetro dependem do cruzamento espacial das camadas, ainda não implementado. Por enquanto, só a Zona Sul (Vila Mariana) tem dados de demonstração; as outras zonas ainda não têm camada carregada.</p></article>'+
  '<article><h2>Assistente de denúncia</h2><p>O texto é montado no navegador a partir das respostas, com base no Guia do Morador e nos Decretos 63.130/2024, 64.244/2025 e 64.895/2026. Nada é enviado nem guardado: fechar a aba apaga tudo.</p></article>'+
  '<article><h2>“Fake HIS” não é categoria jurídica</h2><p>O termo, do LabCidade (FAUUSP), descreve unidades que usam incentivos de HIS sem chegar a quem precisa. É uma leitura analítica: para a lei, a unidade licenciada como HIS continua HIS, e a sanção depende de descumprir renda, teto, destinação de 10 anos ou a proibição da temporada.</p></article>'+
  '</div><p class="foot">Projeto de extensão “Observatório Comunitário de Fiscalização Cidadã e Apoio aos Conselhos de ZEIS”.</p></div>';
}


/* ================= CONTATO ================= */
var TOPICS=[
  {k:"dados",t:"Corrigir um dado do mapa",d:"Uma HIS fora do lugar, um registro jurídico desatualizado."},
  {k:"camada",t:"Enviar arquivo ou fonte de dados",d:"GeoJSON, shapefile ou onde encontrar uma camada que falta."},
  {k:"guia",t:"Dúvida sobre o guia",d:"Algo que não ficou claro ou está desatualizado."},
  {k:"parceria",t:"Associação, coletivo ou parceria",d:"Quer usar o site no seu bairro ou trabalhar junto."},
  {k:"outro",t:"Outro assunto",d:"Sugestões, críticas, imprensa."}
];
function contactMailto(){
  var c=S.contact,t=TOPICS.find(function(x){return x.k===c.topic});
  var subj="HIS.SP — "+(t?t.t:"Contato");
  return "mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent(subj)+(c.msg.trim()?"&body="+encodeURIComponent(c.msg.trim()):"");
}
function mailLinks(){
  var c=S.contact,t=TOPICS.find(function(x){return x.k===c.topic});
  var su="HIS.SP — "+(t?t.t:"Contato"),body=c.msg.trim(),to=CONTACT_EMAIL;
  return {
    gmail:"https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+"&su="+encodeURIComponent(su)+(body?"&body="+encodeURIComponent(body):""),
    outlook:"https://outlook.live.com/mail/0/deeplink/compose?to="+encodeURIComponent(to)+"&subject="+encodeURIComponent(su)+(body?"&body="+encodeURIComponent(body):""),
    app:contactMailto(), subject:su
  };
}
function openMailPop(){
  closeMailPop();
  var L=mailLinks(),prev=document.activeElement;
  var ov=document.createElement("div");ov.className="pop-ov";ov.id="mailpop";
  ov.innerHTML='<div class="pop" role="dialog" aria-modal="true" aria-labelledby="pop-t"><button class="icon-btn pop-x" aria-label="Fechar" data-act="closePop">'+ICON.x+'</button>'+
    '<h2 id="pop-t">Escrever para a equipe</h2><p class="pop-to">Para <b>'+esc(CONTACT_EMAIL)+'</b><br><span>Assunto: '+esc(L.subject)+'</span></p>'+
    '<div class="pop-list">'+
    '<a class="pop-opt" href="'+L.gmail+'" target="_blank" rel="noopener" data-act="popGo"><span class="pop-ic g">G</span><span><b>Abrir no Gmail</b><small>Abre uma nova mensagem no navegador</small></span></a>'+
    '<a class="pop-opt" href="'+L.outlook+'" target="_blank" rel="noopener" data-act="popGo"><span class="pop-ic o">O</span><span><b>Abrir no Outlook</b><small>Hotmail, Outlook e Live</small></span></a>'+
    '<a class="pop-opt" href="'+L.app+'" data-act="popGo"><span class="pop-ic a"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m3 5 7 6 7-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span><b>Aplicativo de e-mail</b><small>O app padrão do celular ou do computador</small></span></a>'+
    '<button class="pop-opt" data-act="copyEmail"><span class="pop-ic c"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 3H5a2 2 0 0 0-2 2v8" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span><b>Copiar endereço</b><small>Para colar onde preferir</small></span></button>'+
    '</div>'+(S.contact.msg.trim()?'<p class="pop-note">Sua mensagem vai junto.</p>':'')+'</div>';
  document.body.appendChild(ov);
  ov._prev=prev;
  ov.addEventListener("click",function(e){if(e.target===ov)closeMailPop()});
  var first=ov.querySelector(".pop-opt");if(first)first.focus();
}
function closeMailPop(){var ov=document.getElementById("mailpop");if(!ov)return;var p=ov._prev;ov.remove();if(p&&p.focus&&document.body.contains(p))p.focus()}
document.addEventListener("keydown",function(e){
  var ov=document.getElementById("mailpop");if(!ov)return;
  if(e.key==="Escape"){e.preventDefault();closeMailPop();return}
  if(e.key==="Tab"){var f=ov.querySelectorAll("a,button");var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
function vContato(){
  var c=S.contact;
  return '<div class="wrap"><div class="page-head"><span class="kicker">Equipe do projeto</span><h1>Fale conosco</h1><p>Achou um erro no mapa, tem dados para compartilhar ou quer levar o HIS.SP para o seu bairro? Escreva para a equipe.</p></div>'+
  '<div class="contact">'+
  '<section class="panel">'+
    '<div class="field"><span class="lbl" id="topic-l">Sobre o que é?</span><div class="choices contact-topics" role="radiogroup" aria-labelledby="topic-l">'+TOPICS.map(function(t){return '<label class="choice radio"><input type="radio" name="topic" value="'+t.k+'" '+(c.topic===t.k?"checked":"")+' data-in="ctopic"><span class="box"></span><span><b>'+t.t+'</b><small>'+t.d+'</small></span></label>'}).join("")+'</div></div>'+
    '<div class="field"><label for="c-msg">Sua mensagem <span style="font-weight:400;color:var(--muted)">(opcional, dá para escrever direto no e-mail)</span></label><textarea class="input" id="c-msg" data-in="cmsg" placeholder="Conte o que precisa. Se for um dado do mapa, diga qual e onde.">'+esc(c.msg)+'</textarea></div>'+
    '<div class="slip-actions" style="margin-top:0"><button class="btn btn-primary" id="c-send" data-act="mailPop" aria-haspopup="dialog">Escrever e-mail</button><button class="btn btn-ghost" data-act="copyEmail">Copiar endereço</button></div>'+
    '<p class="privacy">'+ICON.lock+'<span>Você escolhe onde escrever (Gmail, Outlook ou o aplicativo de e-mail) e a mensagem já abre com o assunto preenchido. O site não envia nem guarda nada.</span></p>'+
  '</section>'+
  '<aside class="contact-side">'+
    '<div class="mailcard"><span class="lbl">E-mail da equipe</span><button class="mail-addr" data-act="mailPop" aria-haspopup="dialog">'+esc(CONTACT_EMAIL)+'</button><span class="mail-hint">Toque para escrever</span></div>'+
    note("brick","alert","<b>Este e-mail não é canal de denúncia.</b> A equipe não investiga nem encaminha casos. Para denunciar uma HIS irregular, registre no 156: o assistente monta o texto para você.")+
    '<a class="btn btn-ghost" style="margin-top:var(--s3);width:100%" href="#/denunciar">Ir para Denunciar</a>'+
    '<div style="margin-top:var(--s4)">'+note("","lock","Não mande nome, foto ou documento de moradores e hóspedes. Se for sobre um prédio, o endereço basta.")+'</div>'+
  '</aside></div></div>';
}

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.dataset.act,m=S.map,r=S.rep;
  switch(a){
    case "menu":var n=$("#nav");n.classList.toggle("open");t.setAttribute("aria-expanded",n.classList.contains("open"));return;
    case "toggleHis":m.showHis=!m.showHis;break;
    case "toggleLayer":var ly=LAYERS.find(function(x){return x.id===t.dataset.id});if(ly)ly.on=t.checked;break;
    case "toggleRing":if(t.tagName==="INPUT"){m.ring=t.checked}else m.ring=!m.ring;break;
    case "phase":m.ph[t.dataset.k]=!m.ph[t.dataset.k];break;
    case "terr":m.terr=t.dataset.k;break;
    case "pick":m.sel=t.dataset.id||null;break;
    case "tab":m.tab=t.dataset.k;break;
    case "filters":m.filtersOpen=!m.filtersOpen;break;
    case "next":if(!canNext())return;if(r.step===4)captureSlip();r.step=Math.min(5,r.step+1);r.max=Math.max(r.max,r.step);render();window.scrollTo(0,0);return;
    case "prev":if(r.step===4)captureSlip();r.step=Math.max(1,r.step-1);render();window.scrollTo(0,0);return;
    case "goStep":var nn=+t.dataset.n;if(nn>r.max)return;if(r.step===4)captureSlip();r.step=nn;render();return;
    case "pickHis":var h=HIS.find(function(x){return x.id===t.dataset.id});if(r.hisId===h.id){r.hisId="";}else{r.hisId=h.id;r.predio=h.nome;r.end=h.end}break;
    case "placa":r.placa=t.dataset.k;break;
    case "addDiary":var w=$("#d-when").value,x=$("#d-what").value.trim();if(!x){$("#d-what").focus();toast("Escreva o que aconteceu");return}r.diary.push({when:w,what:x});r.diary.sort(function(p,q){return (p.when||"").localeCompare(q.when||"")});render();$("#d-what").focus();return;
    case "delDiary":r.diary.splice(+t.dataset.i,1);break;
    case "channel":captureSlip();r.channel=t.dataset.k;r.edited=false;break;
    case "sigilo":r.sigilo=t.checked;r.edited=false;break;
    case "regen":r.edited=false;break;
    case "copy":captureSlip();copy($("#slip-ta").value,"Texto copiado");return;
    case "download":captureSlip();download($("#slip-ta").value);return;
    case "done":r.done[+t.dataset.i]=t.checked;break;
    case "copyLAI":copy(LAI_TXT,"Modelo copiado");return;
    case "copyEmail":copy(CONTACT_EMAIL,"Endereço copiado");closeMailPop();return;
    case "mailPop":e.preventDefault();openMailPop();return;
    case "closePop":closeMailPop();return;
    case "popGo":setTimeout(closeMailPop,50);return;
    case "newReport":S.rep=freshReport();break;
    case "capcat":capState(t.dataset.scope).cat=t.dataset.k;break;
    case "capmode":var cs=capState(t.dataset.scope);cs.mode=t.dataset.k;break;
    case "quiz":S.guide.quiz[+t.dataset.i]=t.dataset.v==="s";break;
    case "jurf":S.jur=t.dataset.k;break;
    case "cobf":S.cob=t.dataset.k;break;
    case "cite":var j=JUR[+t.dataset.i];copy(j.date+" — "+j.inst+". "+j.reg+". Fonte: "+j.fonte+".","Referência copiada");return;
    case "pdf":e.preventDefault();openPdf(t.dataset.mode);return;
    case "startObra":S.rep=freshReport();S.rep.kind="obra";S.rep.max=1;return;
    case "size":return;
    default:return;
  }
  if(t.tagName!=="INPUT")e.preventDefault();
  rerenderKeepFocus();
  if(a==="pick"&&window.innerWidth<=900){var fi=$(".ficha");if(fi)fi.scrollIntoView({behavior:"smooth",block:"start"})}
  if(a==="pick"&&/^h\d/.test(t.dataset.id||""))setTimeout(ctaPulse,250);
});
document.querySelectorAll("[data-size]").forEach(function(b){b.addEventListener("click",function(){document.documentElement.dataset.size=b.dataset.size;document.querySelectorAll("[data-size]").forEach(function(x){x.setAttribute("aria-pressed",x===b)})})});
function capState(s){return s==="rep"?S.rep.cap:S.guide.calc}
function captureSlip(){var ta=$("#slip-ta");if(ta){S.rep.text=ta.value}}
document.addEventListener("input",function(e){
  var t=e.target,k=t.dataset.in;if(!k)return;var r=S.rep;
  switch(k){
    case "mapq":S.map.q=t.value;rerenderKeepFocus();return;
    case "kind":r.kind=t.value;r.signs=r.signs.filter(function(s){return (SIGNS[r.kind]||[]).indexOf(s)>-1});rerenderKeepFocus();return;
    case "predio":case "end":case "torre":case "unid":case "link":case "codigo":case "desc":r[k]=t.value;if(k==="predio"||k==="end")r.hisId="";refreshPreview();return;
    case "sign":if(t.checked){if(r.signs.indexOf(t.value)<0)r.signs.push(t.value)}else r.signs=r.signs.filter(function(s){return s!==t.value});refreshPreview();return;
    case "slip":r.text=t.value;if(!r.edited){r.edited=true;var head=$(".slip-head");if(head){var tg=head.querySelector(".tag");if(tg)tg.outerHTML='<button class="btn btn-ghost btn-sm" data-act="regen">Refazer com as respostas</button>'}}return;
    case "proto":r.proto=t.value;return;
    case "protoDate":r.protoDate=t.value;rerenderKeepFocus();return;
    case "capval":var c=capState(t.dataset.scope);c.val=t.value;var out=$("#capout-"+t.dataset.scope);if(out)out.innerHTML=capVerdict(capCheck(c));if(t.dataset.scope==="rep")refreshPreview();return;
    case "gq":S.guide.gq=t.value;rerenderKeepFocus();return;
    case "ctopic":S.contact.topic=t.value;return;
    case "cmsg":S.contact.msg=t.value;return;
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="d-what"){e.preventDefault();$('[data-act="addDiary"]').click()}});
function copy(txt,msg){
  function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(err){toast("Selecione o texto e copie")}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(msg)},fb)}else fb();
}
function download(txt){var b=new Blob([txt],{type:"text/plain;charset=utf-8"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="denuncia-his.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);toast("Arquivo baixado")}
var PDF_B64="",pdfUrl="Guia_do_Morador.pdf";
function openPdf(mode){
  try{if(!pdfUrl){var bin=atob(PDF_B64),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);pdfUrl=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}))}
    if(mode==="open"){var w=window.open(pdfUrl,"_blank");if(!w)toast("Permita pop-ups para abrir o PDF")}
    else{var a=document.createElement("a");a.href=pdfUrl;a.download="Guia_do_Morador.pdf";document.body.appendChild(a);a.click();a.remove();toast("PDF baixado")}
  }catch(err){toast("Não foi possível abrir o PDF")}
}
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(S.route==="mapa")rerenderKeepFocus()},150)});
function ctaPulse(){var c=document.getElementById("cta");if(!c||S.route==="denunciar")return;c.classList.remove("pulse");void c.offsetWidth;c.classList.add("pulse");clearTimeout(ctaPulse._t);ctaPulse._t=setTimeout(function(){c.classList.remove("pulse")},3400)}
function logoScan(){var b=document.querySelector(".brand");if(!b)return;b.classList.remove("scan");void b.offsetWidth;b.classList.add("scan")}
setTimeout(logoScan,300);
loadLayers();
document.querySelector(".brand").addEventListener("mouseenter",function(){var b=this;if(b._t)return;logoScan();b._t=setTimeout(function(){b._t=null},1500)});
document.querySelector(".brand").addEventListener("focus",logoScan);
setTimeout(ctaPulse,1800);
window.addEventListener("hashchange",go);
go();
})();
</script>
